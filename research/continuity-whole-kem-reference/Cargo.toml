[package]
name = "q-periapt-whole-kem-reference"
version = "0.0.0"
edition = "2021"
publish = false
license = "AGPL-3.0-only"
description = "Isolated authenticated whole-KEM periodic-update control"

[workspace]
resolver = "2"
members = ["."]

[dependencies]
rand = "=0.9.1"
prost = "=0.14.1"
serde_json = "=1.0.140"
sha2 = "=0.10.8"
hkdf = "=0.12.4"
libcrux-hmac = "=0.0.6"
subtle = "=2.6.1"
libcrux-ml-kem = { version = "=0.0.8", default-features = false, features = ["incremental", "mlkem768"] }

[target.'cfg(not(any(windows, target_arch = "x86")))'.dependencies]
sha2 = { version = "=0.10.8", features = ["asm"] }

[dev-dependencies]
hmac = "=0.12.1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
indexing_slicing = "deny"
panic = "deny"
