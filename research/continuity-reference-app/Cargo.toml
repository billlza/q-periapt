[package]
name = "q-periapt-continuity-reference-app"
version = "0.0.0"
edition = "2021"
rust-version = "1.90"
publish = false
license = "Apache-2.0 OR MIT"
description = "Independent host application for Continuity account and device lifecycle qualification"
default-run = "q-periapt-continuity-reference-app"

[[example]]
name = "inbox-crash-probe"
path = "tests/support/inbox_crash_probe.rs"

[workspace]

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "=0.22.1"
getrandom = "=0.4.0"
q-periapt-host-store = { version = "=0.2.0", path = "../../crates/q-periapt-host-store" }
q-periapt-continuity-identity-candidate = { path = "../continuity-identity-candidate" }
q-periapt-sdk = { version = "=0.2.0", path = "../../crates/q-periapt-sdk" }
q-periapt-policy = { version = "=0.2.0", path = "../../crates/q-periapt-policy" }
redb = "=4.3.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
webauthn-rs = "=0.5.5"

[dev-dependencies]
q-periapt-backends = { version = "=0.2.0", path = "../../crates/q-periapt-backends" }
q-periapt-sig = { version = "=0.2.0", path = "../../crates/q-periapt-sig" }
zeroize = "=1.9.1"
webauthn-authenticator-rs = { version = "=0.5.5", default-features = false, features = ["softpasskey"] }
tower = { version = "0.5", features = ["util"] }
tempfile = "=3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
overflow-checks = true

[lints.rust]
unsafe_code = "forbid"
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
