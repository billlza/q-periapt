[package]
name = "q-periapt-continuity-c-consumer"
version = "0.0.0"
edition = "2021"
rust-version = "1.90"
publish = false
license = "Apache-2.0 OR MIT"

# Unpublished installed-package consumer, outside the product ABI 2 graph.
[workspace]

[lib]
name = "q_periapt_continuity_c_consumer"
crate-type = ["cdylib", "rlib"]

[features]
default = ["connection-tls", "control-tls"]
connection-tls = ["q-periapt-continuity-identity-candidate/connection-tls"]
control-tls = ["q-periapt-continuity-identity-candidate/control-tls"]

[dependencies]
q-periapt-continuity-identity-candidate = { package = "q-periapt-continuity", version = "=0.2.0", features = ["connection-tls", "control-tls", "anchor-tls"] }
q-periapt-host-store = "=0.2.0"
q-periapt-policy = "=0.2.0"
q-periapt-sdk = { version = "=0.2.0", features = ["sealed-operations"] }
q-periapt-rustls = { version = "=0.2.0", features = ["reference-connection"] }
rustls = { version = "=0.23.46", default-features = false, features = ["std"] }
zeroize = "1"

[dev-dependencies]
redb = "=4.3.0"
sha3 = { version = "=0.12.0", default-features = false }
q-periapt-backends = "=0.2.0"
q-periapt-sig = "=0.2.0"
getrandom = "0.4"
rcgen = "=0.14.10"
tempfile = "=3.27.0"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
indexing_slicing = "deny"
panic = "deny"
unwrap_used = "deny"

[profile.dev.package."*"]
opt-level = 3
debug-assertions = true
overflow-checks = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
overflow-checks = true

[patch.crates-io]
q-periapt-mlkem-native-sys = { path = "/workspace/scratch/5173067707b5/release-work/crates/q-periapt-mlkem-native-sys" }
q-periapt-core = { path = "/workspace/scratch/5173067707b5/release-work/crates/q-periapt-core" }
q-periapt-kem = { path = "/workspace/scratch/5173067707b5/release-work/crates/q-periapt-kem" }
q-periapt-sig = { path = "/workspace/scratch/5173067707b5/release-work/crates/q-periapt-sig" }
q-periapt-backends = { path = "/workspace/scratch/5173067707b5/release-work/crates/q-periapt-backends" }
q-periapt-policy = { path = "/workspace/scratch/5173067707b5/release-work/crates/q-periapt-policy" }
q-periapt-sdk = { path = "/workspace/scratch/5173067707b5/release-work/crates/q-periapt-sdk" }
q-periapt-host-store = { path = "/workspace/scratch/5173067707b5/release-work/crates/q-periapt-host-store" }
q-periapt-rustls = { path = "/workspace/scratch/5173067707b5/release-work/crates/q-periapt-rustls" }
q-periapt-continuity = { path = "/workspace/scratch/5173067707b5/release-work/research/continuity-identity-candidate" }
