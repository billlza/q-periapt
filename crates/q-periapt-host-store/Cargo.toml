[package]
name = "q-periapt-host-store"
version.workspace = true
description = "Private host policy persistence and runtime ownership for Q-Periapt"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
publish = ["crates-io"]

[lints]
workspace = true

[dependencies]
q-periapt-core = { version = "=0.2.0", path = "../q-periapt-core" }
q-periapt-sdk = { version = "=0.2.0", path = "../q-periapt-sdk" }
q-periapt-policy = { version = "=0.2.0", path = "../q-periapt-policy" }
q-periapt-backends = { version = "=0.2.0", path = "../q-periapt-backends" }
q-periapt-sig = { version = "=0.2.0", path = "../q-periapt-sig" }
sha2 = { version = "=0.11.0", default-features = false, features = ["zeroize"] }
# Reuse the workspace's pinned storage implementation and reviewed file format.
redb = "=4.3.0"
getrandom = "0.4"

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.5", features = ["fs", "process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization",
    "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading",
    "Win32_System_SystemServices", "Wdk_Foundation", "Wdk_Storage_FileSystem",
    "Wdk_System_SystemServices",
] }

[dev-dependencies]
tempfile = "=3.27.0"
