[package]
name = "q-periapt-sdk"
version.workspace = true
description = "Owned, signed-policy ContextBound runtime for Q-Periapt"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
publish = ["crates-io"]

[lints]
workspace = true

[features]
linux-x86_64-avx2 = ["q-periapt-backends/linux-x86_64-avx2"]

[dependencies]
q-periapt-core = { version = "=0.2.0-alpha.1", path = "../q-periapt-core" }
q-periapt-kem = { version = "=0.2.0-alpha.1", path = "../q-periapt-kem" }
q-periapt-backends = { version = "=0.2.0-alpha.1", path = "../q-periapt-backends" }
q-periapt-policy = { version = "=0.2.0-alpha.1", path = "../q-periapt-policy" }
getrandom = "0.4"
# HKDF is a separate application-key layer, not a replacement ContextBound
# combiner. Enable state/buffer erasure in its HMAC and SHA-256 dependencies.
hkdf = "=0.13.0"
hmac = { version = "=0.13.0", features = ["zeroize"] }
sha2 = { version = "=0.11.0", default-features = false, features = ["zeroize"] }
zeroize = "1"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
q-periapt-sig = { version = "=0.2.0-alpha.1", path = "../q-periapt-sig" }
