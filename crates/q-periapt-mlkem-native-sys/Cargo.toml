[package]
name = "q-periapt-mlkem-native-sys"
description = "Auditable safe Rust boundary for target-selected mlkem-native implementations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
build = "build.rs"
links = "q_periapt_mlkem_native"
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/LICENSES/**",
    "/README.md",
    "/build.rs",
    "/src/*.S",
    "/src/*.c",
    "/src/*.h",
    "/src/*.rs",
    "/vendor/INVENTORY.sha256",
    "/vendor/LICENSE-INVENTORY.md",
    "/vendor/LICENSE.mlkem-native",
    "/vendor/PROVENANCE.md",
    "/vendor/mlkem-native/**/*.c",
    "/vendor/mlkem-native/**/*.h",
    "/vendor/mlkem-native/**/*.inc",
    "/vendor/mlkem-native/**/*.S",
]

[lints]
workspace = true

[build-dependencies]
# Held at exactly 1.2.67 by the publication contract, not by choice here:
# artifact/rust-publish-contract.sh refuses to package this crate unless its
# sole C build dependency is pinned to this version, and rust_publish_contract.py
# records `sys_build_dependency=cc@1.2.67` as a proof input. Lifting the hold
# means re-issuing that contract (and re-running the binary constant-time
# evidence against the new compiler-driver behaviour), not editing this line.
cc = "=1.2.67"

[dev-dependencies]
sha3 = { version = "=0.10.9", default-features = false }
