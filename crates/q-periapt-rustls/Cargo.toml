[package]
name = "q-periapt-rustls"
description = "Research integration of Q-Periapt's private-use hybrid groups with rustls TLS 1.3"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"

[lints]
workspace = true

[dependencies]
# ring-only base provider: no aws-lc-sys C library in the production tree, TLS 1.3 only
# (the RFC 10024 X25519MLKEM768 baseline used by tests/netem is behind `bench-baseline`).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
q-periapt-core = { version = "=0.1.1", path = "../q-periapt-core" }
q-periapt-kem = { version = "=0.1.1", path = "../q-periapt-kem" }
q-periapt-backends = { version = "=0.1.1", path = "../q-periapt-backends" }
q-periapt-policy = { version = "=0.1.1", path = "../q-periapt-policy" }

[features]
# Only the RFC 10024 comparison tests/netem arm need aws-lc-rs; opt-in so the
# production library never pulls the aws-lc-sys C backend.
bench-baseline = ["rustls/aws_lc_rs"]

[dev-dependencies]
rcgen = "0.13"
socket2 = "0.5"  # stable SO_LINGER for the netem bench (std set_linger is nightly-only)

[[example]]
name = "netem_bench"
required-features = ["bench-baseline"]
