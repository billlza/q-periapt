[package]
name = "q-periapt-rustls"
description = "Separate standard PQ/T TLS 1.3 and Q-Periapt private-group integrations for rustls"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"

[lints]
workspace = true

[dependencies]
# The default private-group provider remains ring-based. Standard TLS is an
# explicit feature using rustls's maintained AWS-LC hybrid implementation.
# RUSTSEC-2026-0285: reject handshake records that cross a TLS 1.3 key change.
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "logging"] }
q-periapt-core = { version = "=0.2.0", path = "../q-periapt-core" }
q-periapt-kem = { version = "=0.2.0", path = "../q-periapt-kem" }
q-periapt-backends = { version = "=0.2.0", path = "../q-periapt-backends" }
q-periapt-policy = { version = "=0.2.0", path = "../q-periapt-policy" }
q-periapt-sdk = { version = "=0.2.0", path = "../q-periapt-sdk", optional = true }
sha2 = { version = "=0.11.0", default-features = false, features = ["zeroize"], optional = true }

[features]
# Separate wire/security contract; never silently selected by a private provider.
standard-tls = ["rustls/aws_lc_rs"]
# Reference connection adds authenticated application-policy confirmation and
# bounded message framing, without changing either TLS/KEM construction.
reference-connection = ["standard-tls", "dep:q-periapt-sdk", "dep:sha2"]
# Retained comparison harness also exercises the standard implementation.
bench-baseline = ["standard-tls"]

[dev-dependencies]
rcgen = "0.14"
q-periapt-host-store = { version = "=0.2.0", path = "../q-periapt-host-store" }
q-periapt-sig = { version = "=0.2.0", path = "../q-periapt-sig" }
socket2 = "0.6"  # stable SO_LINGER for the netem bench (std set_linger is nightly-only)

[target.'cfg(unix)'.dev-dependencies]
# Reuse the policy agent's pinned readiness API for the bounded reference peer.
rustix = { version = "=1.1.4", features = ["event"] }

[[example]]
name = "netem_bench"
required-features = ["bench-baseline"]

[[example]]
name = "standard_peer"
required-features = ["standard-tls"]

[[example]]
name = "connection_peer"
required-features = ["reference-connection"]
