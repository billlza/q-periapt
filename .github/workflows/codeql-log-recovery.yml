name: Retained CodeQL query-log recovery

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  recover:
    name: Recover fixed WASM query logs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Test archive admission, output bounds and credential isolation
        timeout-minutes: 2
        run: sh artifact/python-run.sh -m unittest -v test_codeql_log_recovery
      - name: Recover logs from the exact retained artifact
        timeout-minutes: 22
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sh artifact/python-run.sh artifact/codeql_log_recovery.py \
            --output "$RUNNER_TEMP/codeql-query-log-recovery"
      - name: Retain recovered logs and recovery failures
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: codeql-wasm-retained-query-logs-13609897355
          path: ${{ runner.temp }}/codeql-query-log-recovery/evidence/**
          if-no-files-found: error
          retention-days: 14
