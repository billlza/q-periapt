name: Continuity matched directed opportunities

on:
  pull_request:
    paths:
      - .github/workflows/continuity-matched-comparison.yml
      - research/continuity-matched-comparison/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: continuity-matched-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  matched:
    name: native-and-reference-matched
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Make the explicit experiment base available
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 358b921ab3469ce49f166633fc9a762ff6ed7e3d
          test "$(git rev-parse 358b921ab3469ce49f166633fc9a762ff6ed7e3d)" = 358b921ab3469ce49f166633fc9a762ff6ed7e3d
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.98.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.14.7"
          check-latest: false
      - name: Install existing native and AEAD audit dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libssl-dev pkg-config
          git show 358b921ab3469ce49f166633fc9a762ff6ed7e3d:research/continuity-openssl-peer/requirements.txt > "$RUNNER_TEMP/matched-requirements.txt"
          python -m pip install --require-hashes --only-binary=:all: -r "$RUNNER_TEMP/matched-requirements.txt"
      - name: Check schedule and altered-trace controls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/continuity-matched-controls
          python -m unittest discover -s research/continuity-matched-comparison -p 'test_*.py' -v 2>&1 | tee target/continuity-matched-controls/controls.log
          python research/continuity-matched-comparison/schedule.py > target/continuity-matched-controls/schedule.json
      - name: Compile and execute native and matched references
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        shell: bash
        run: |
          set -euo pipefail
          python research/continuity-matched-comparison/run.py run --repository "$GITHUB_WORKSPACE" --output "$GITHUB_WORKSPACE/target/continuity-matched-execution"
      - name: Retain public execution evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: continuity-matched-directed-opportunities
          if-no-files-found: error
          include-hidden-files: false
          path: |
            target/continuity-matched-controls
            target/continuity-matched-execution/evidence
            target/continuity-matched-execution/logs
            target/continuity-matched-execution/preparation.json
            target/continuity-matched-execution/variant-preparation.json
            target/continuity-matched-execution/runtime.json
            target/continuity-matched-execution/executables.json
