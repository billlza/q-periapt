name: CodeQL query resource control

on:
  push:
    branches: [lza/codeql-query-resource-control]

permissions:
  contents: read
  actions: read

jobs:
  evaluate:
    name: Frozen database, ${{ matrix.threads }} evaluator threads
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        threads: [4, 1]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Check archive admission and bounded child cleanup
        run: python3 -B -m unittest test_evaluate
      - uses: github/codeql-action/setup-codeql@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        id: codeql
        with:
          tools: linked
          languages: rust
      - name: Evaluate the immutable database and all 39 original queries
        env:
          GH_TOKEN: ${{ github.token }}
          CODEQL_BINARY: ${{ steps.codeql.outputs.codeql-path }}
          CASE_THREADS: ${{ matrix.threads }}
        run: |
          python3 -B evaluate.py run --codeql "$CODEQL_BINARY" --threads "$CASE_THREADS" \
            --output "$RUNNER_TEMP/codeql-resource-$CASE_THREADS"
      - name: Retain the result, including incomplete and timed out evaluations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: codeql-query-control-threads-${{ matrix.threads }}
          path: ${{ runner.temp }}/codeql-resource-${{ matrix.threads }}/evidence/**
          if-no-files-found: error
          retention-days: 14
