name: Text integrity review

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out exact source snapshot
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: 391d6ef3fc04f153eeca31b2560f1d8741570bf5

      - name: Scan tracked blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "391d6ef3fc04f153eeca31b2560f1d8741570bf5"
          mkdir -p target/text-integrity-review
          /usr/bin/python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, unicodedata

          root = pathlib.Path.cwd()
          out = root / "target" / "text-integrity-review"
          source_commit = "391d6ef3fc04f153eeca31b2560f1d8741570bf5"
          terms = [
              b"cl" + b"aude",
              b"anth" + b"ropic",
              b"noreply@" + b"anth" + b"ropic.com",
              b"generated with " + b"cl" + b"aude",
              b"generated by " + b"cl" + b"aude",
          ]
          named = {
              0x00AD: "SOFT HYPHEN", 0x034F: "COMBINING GRAPHEME JOINER",
              0x061C: "ARABIC LETTER MARK", 0x180E: "MONGOLIAN VOWEL SEPARATOR",
              0x200B: "ZERO WIDTH SPACE", 0x200C: "ZERO WIDTH NON-JOINER",
              0x200D: "ZERO WIDTH JOINER", 0x200E: "LEFT-TO-RIGHT MARK",
              0x200F: "RIGHT-TO-LEFT MARK", 0x202A: "LEFT-TO-RIGHT EMBEDDING",
              0x202B: "RIGHT-TO-LEFT EMBEDDING", 0x202C: "POP DIRECTIONAL FORMATTING",
              0x202D: "LEFT-TO-RIGHT OVERRIDE", 0x202E: "RIGHT-TO-LEFT OVERRIDE",
              0x2060: "WORD JOINER", 0x2061: "FUNCTION APPLICATION",
              0x2062: "INVISIBLE TIMES", 0x2063: "INVISIBLE SEPARATOR",
              0x2064: "INVISIBLE PLUS", 0x2066: "LEFT-TO-RIGHT ISOLATE",
              0x2067: "RIGHT-TO-LEFT ISOLATE", 0x2068: "FIRST STRONG ISOLATE",
              0x2069: "POP DIRECTIONAL ISOLATE", 0xFEFF: "ZERO WIDTH NO-BREAK SPACE/BOM",
              0xFFF9: "INTERLINEAR ANNOTATION ANCHOR",
              0xFFFA: "INTERLINEAR ANNOTATION SEPARATOR",
              0xFFFB: "INTERLINEAR ANNOTATION TERMINATOR",
          }
          for cp in range(0x206A, 0x2070):
              named[cp] = unicodedata.name(chr(cp), "DEPRECATED FORMAT CONTROL")

          def classify(cp, index):
              if cp == 0xFEFF and index == 0:
                  return None
              if cp in named:
                  return ("review" if cp in (0x200C, 0x200D) else "high", named[cp])
              if 0xE0000 <= cp <= 0xE007F:
                  return "high", "UNICODE TAG CHARACTER"
              if 0xFE00 <= cp <= 0xFE0F or 0xE0100 <= cp <= 0xE01EF:
                  return "review", "VARIATION SELECTOR"
              category = unicodedata.category(chr(cp))
              if category == "Co":
                  return "review", "PRIVATE USE CHARACTER"
              if category == "Cf":
                  return "review", unicodedata.name(chr(cp), "FORMAT CHARACTER")
              return None

          def decode(data):
              if data.startswith(b"\xef\xbb\xbf"):
                  return data[3:].decode("utf-8"), "utf-8", 3
              if data.startswith(b"\xff\xfe"):
                  return data[2:].decode("utf-16-le"), "utf-16-le", 2
              if data.startswith(b"\xfe\xff"):
                  return data[2:].decode("utf-16-be"), "utf-16-be", 2
              try:
                  return data.decode("utf-8"), "utf-8", 0
              except UnicodeDecodeError:
                  return None

          raw = subprocess.check_output(["git", "ls-files", "-s", "-z"])
          entries = []
          for record in raw.split(b"\0"):
              if not record:
                  continue
              meta, raw_path = record.split(b"\t", 1)
              entries.append((meta.split(b" ", 1)[0].decode("ascii"), os.fsdecode(raw_path)))

          findings = []
          total_bytes = 0
          for mode, path in entries:
              full = root / path
              if mode == "120000":
                  data = os.readlink(full).encode("utf-8", "surrogateescape")
              elif mode == "160000":
                  data = b""
              else:
                  data = full.read_bytes()
              total_bytes += len(data)
              lower = data.lower()
              for term in terms:
                  pos = 0
                  while True:
                      pos = lower.find(term.lower(), pos)
                      if pos < 0:
                          break
                      findings.append({
                          "path": path, "kind": "attribution_marker", "severity": "high",
                          "byte_offset": pos, "term_ascii": term.decode("ascii"),
                          "context_hex": data[max(0, pos - 24):pos + len(term) + 24].hex(),
                      })
                      pos += 1
              decoded = decode(data)
              if decoded is not None:
                  text, encoding, offset = decoded
                  line = column = 1
                  for index, char in enumerate(text):
                      cp = ord(char)
                      item = classify(cp, index)
                      if item:
                          severity, name = item
                          findings.append({
                              "path": path, "kind": "unicode_control_or_invisible",
                              "severity": severity, "codepoint": f"U+{cp:04X}",
                              "unicode_name": name, "unicode_category": unicodedata.category(char),
                              "byte_offset": offset, "line": line, "column": column,
                              "encoding": encoding,
                              "context_escaped": text[max(0,index-24):index+25].encode("unicode_escape").decode("ascii"),
                          })
                      if cp < 0x20 and char not in "\t\n\r\f":
                          findings.append({
                              "path": path, "kind": "unexpected_ascii_control", "severity": "high",
                              "codepoint": f"U+{cp:04X}", "byte_offset": offset,
                              "line": line, "column": column, "encoding": encoding,
                          })
                      offset += len(char.encode(encoding))
                      if char == "\n": line, column = line + 1, 1
                      else: column += 1
              for index, char in enumerate(path):
                  item = classify(ord(char), index)
                  if item:
                      severity, name = item
                      findings.append({
                          "path": path, "kind": "filename_unicode_control_or_invisible",
                          "severity": severity, "codepoint": f"U+{ord(char):04X}",
                          "unicode_name": name, "character_index": index,
                      })

          report = {
              "schema_version": 1,
              "source_commit": source_commit,
              "tracked_entries": len(entries),
              "total_blob_bytes": total_bytes,
              "finding_count": len(findings),
              "high_count": sum(x["severity"] == "high" for x in findings),
              "review_count": sum(x["severity"] == "review" for x in findings),
              "findings": findings,
          }
          report_bytes = (json.dumps(report, indent=2, sort_keys=True, ensure_ascii=True) + "\n").encode()
          (out / "report.json").write_bytes(report_bytes)
          print(json.dumps({k: report[k] for k in (
              "source_commit", "tracked_entries", "total_blob_bytes", "finding_count",
              "high_count", "review_count")}, sort_keys=True))
          for finding in findings:
              print("TEXT_INTEGRITY_FINDING " + json.dumps(finding, sort_keys=True, ensure_ascii=True))
          print("report_sha256=" + hashlib.sha256(report_bytes).hexdigest())
          PY

      - name: Upload report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: text-integrity-review
          path: target/text-integrity-review/report.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
