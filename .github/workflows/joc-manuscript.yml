name: JoC manuscript

on:
  pull_request:
    paths:
      - 'paper/continuity/**'
      - '.github/workflows/joc-manuscript.yml'
      - 'artifact/python-run.sh'
      - 'artifact/python-env.sh'
      - 'artifact/python_bootstrap.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: joc-manuscript-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  manuscript:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out manuscript source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify source identity
        env:
          EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          mkdir -p paper/continuity/build
          git rev-parse HEAD > paper/continuity/build/source-commit.txt
      - name: Install LaTeX and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y latexmk texlive-latex-extra texlive-fonts-recommended texlive-science lmodern poppler-utils
      - name: Compile and verify the manuscript
        run: make -B -C paper/continuity check PYTHON="sh $GITHUB_WORKSPACE/artifact/python-run.sh"
      - name: Exercise the retained finite-record model
        run: |
          mkdir -p paper/continuity/build/finite-model
          cp paper/continuity/artifacts/guarded-provenance/check_exposure.py paper/continuity/artifacts/guarded-provenance/review_exposure.py paper/continuity/build/finite-model/
          sh artifact/python-run.sh -c 'import sys; print(sys.version)' > paper/continuity/build/finite-model/python-version.txt
          sh artifact/python-run.sh paper/continuity/build/finite-model/check_exposure.py --output paper/continuity/build/finite-model/results.json
          sh artifact/python-run.sh paper/continuity/build/finite-model/review_exposure.py
      - name: Check ContextBound encodings and adapter witnesses
        run: sh artifact/python-run.sh paper/continuity/artifacts/contextbound-connection/check_contextbound_adapter.py --output paper/continuity/build/contextbound-check.json
      - name: Check finite confirmation and traffic interfaces
        run: sh artifact/python-run.sh paper/continuity/artifacts/confirmation-traffic/check_interfaces.py --finite-only --output paper/continuity/build/confirmation-traffic-check.json
      - name: Check out pinned native attribution sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: billlza/q-periapt
          ref: 72acaaccde1ca9ea27e5af022da5fbce932ed4e9
          path: paper/continuity/build/source-attribution-native
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            research/continuity-identity-candidate/src/crypto.rs
            research/continuity-identity-candidate/src/crypto/persistence.rs
            research/continuity-identity-candidate/src/durable/messages/rekey.rs
            research/continuity-identity-candidate/src/durable/messages/rekey/response.rs
            research/continuity-identity-candidate/src/durable/messages/rekey/completion.rs
            research/continuity-identity-candidate/src/durable/messages/tests/classical_alias.rs
            research/continuity-identity-candidate/src/contract.rs
      - name: Verify native attribution source identity
        run: |
          test "$(git -C paper/continuity/build/source-attribution-native rev-parse HEAD)" = "72acaaccde1ca9ea27e5af022da5fbce932ed4e9"
          git -C paper/continuity/build/source-attribution-native rev-parse HEAD > paper/continuity/build/native-source-commit.txt
      - name: Check source attribution models and pinned native interfaces
        run: sh artifact/python-run.sh paper/continuity/artifacts/source-attribution/check_source_attribution.py --repository "$GITHUB_WORKSPACE/paper/continuity/build/source-attribution-native" --output paper/continuity/build/source-attribution-check.json
      - name: Check signature bridge controls and authenticated source packet
        run: |
          sh artifact/python-run.sh paper/continuity/artifacts/signature-bridge/check_bridge.py --crate-archive paper/continuity/artifacts/signature-bridge/sources/fips204-0.4.6.crate > paper/continuity/build/signature-bridge-check.json
          sh artifact/python-run.sh paper/continuity/artifacts/signature-bridge/review_generic_controls.py > paper/continuity/build/signature-bridge-review.json
      - name: Reproduce the retained reference schedule comparison
        run: sh artifact/python-run.sh paper/continuity/artifacts/reference-comparison/analyze_reference.py --check > paper/continuity/build/reference-comparison-check.json
      - name: Check native authentication event accounting
        run: sh artifact/python-run.sh paper/continuity/artifacts/native-authentication/review_auth_bit_accounting.py > paper/continuity/build/native-authentication-check.json
      - name: Package the single-file source
        run: sh artifact/python-run.sh paper/continuity/export_submission.py --output paper/continuity/build/joc-source.zip
      - name: Verify the exported manuscript source
        run: sh artifact/python-run.sh paper/continuity/artifacts/bootstrap/verify_source_export.py --archive paper/continuity/build/joc-source.zip --reading-copy paper/continuity/continuity.pdf --work-directory paper/continuity/build/source-export --output paper/continuity/build/source-export-check.json
      - name: Upload manuscript and source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: joc-manuscript-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            paper/continuity/continuity.pdf
            paper/continuity/build/joc-source.zip
            paper/continuity/build/build-check.json
            paper/continuity/build/source-commit.txt
            paper/continuity/build/native-source-commit.txt
            paper/continuity/build/finite-model/python-version.txt
            paper/continuity/build/finite-model/results.json
            paper/continuity/build/finite-model/review_results.json
            paper/continuity/build/contextbound-check.json
            paper/continuity/build/confirmation-traffic-check.json
            paper/continuity/build/source-attribution-check.json
            paper/continuity/build/signature-bridge-check.json
            paper/continuity/build/signature-bridge-review.json
            paper/continuity/build/reference-comparison-check.json
            paper/continuity/build/native-authentication-check.json
            paper/continuity/build/bootstrap-entry.json
            paper/continuity/build/bootstrap-terminal.json
            paper/continuity/build/bootstrap-reply.json
            paper/continuity/build/bootstrap-initial.json
            paper/continuity/build/source-export-check.json
          if-no-files-found: error
      - name: Preserve build diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: joc-manuscript-diagnostics-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            paper/continuity/build/*.log
            paper/continuity/build/*.blg
            paper/continuity/build/build-check.json
            paper/continuity/build/source-commit.txt
            paper/continuity/build/native-source-commit.txt
          if-no-files-found: warn
