name: Windows private storage API observations
on:
  push:
    branches: [lza/windows-private-storage-probe]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Observe native namespace and flush behavior
        shell: pwsh
        run: ./run.ps1
      - name: Retain all observations and failed controls
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-private-storage-${{ matrix.os }}
          path: |
            out/environment.json
            out/build.stdout
            out/build.stderr
            out/observations.jsonl
            out/probe.stderr
            out/exit-code.txt
          if-no-files-found: error
