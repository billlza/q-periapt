name: peer-configuration-lifetime

on:
  pull_request:
    paths:
      - .github/workflows/peer-configuration-lifetime.yml
      - artifact/test_peer_configuration_lifetime.py
      - artifact/testdata/peer_configuration_lifetime.c
      - bindings/c/ContinuityPackageConsumer/peer_configuration_client.c
      - bindings/c/ContinuityPackageConsumer/qpc_owner.h
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu-2204-lifetime:
    # Extra compiler diagnostic; the complete ci workflow remains unchanged.
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/peer-configuration-lifetime.yml
            /artifact/test_peer_configuration_lifetime.py
            /artifact/testdata/peer_configuration_lifetime.c
            /bindings/c/ContinuityPackageConsumer/peer_configuration_client.c
            /bindings/c/ContinuityPackageConsumer/qpc_owner.h
            /artifact/python-run.sh
            /artifact/python-env.sh
            /artifact/python_bootstrap.py
      - name: Record source and run the existing optimized C controls
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          diagnostic_output=target/peer-configuration-lifetime
          mkdir -p "$diagnostic_output"
          diagnostic_commit=$(git rev-parse --verify 'HEAD^{commit}')
          test "$diagnostic_commit" = "$EXPECTED_COMMIT"
          printf 'checkout_commit=%s\nhead_commit=%s\n' \
            "$diagnostic_commit" "$EXPECTED_HEAD" | tee "$diagnostic_output/source.txt"
          sha256sum .github/workflows/peer-configuration-lifetime.yml \
            artifact/test_peer_configuration_lifetime.py \
            artifact/testdata/peer_configuration_lifetime.c \
            bindings/c/ContinuityPackageConsumer/peer_configuration_client.c \
            bindings/c/ContinuityPackageConsumer/qpc_owner.h \
            artifact/python-run.sh artifact/python-env.sh artifact/python_bootstrap.py \
            > "$diagnostic_output/source-files.sha256"
          command -v cc | tee "$diagnostic_output/cc-path.txt"
          cc --version 2>&1 | tee "$diagnostic_output/cc-version.txt"
          cc -dumpmachine | tee "$diagnostic_output/cc-target.txt"

          # Ubuntu 22.04's system Python is 3.10. Select an already installed
          # CPython 3.11 from the runner cache, the hardened launcher's minimum.
          # This diagnostic downloads no compiler or Python toolchain.
          diagnostic_python=
          for candidate in "$RUNNER_TOOL_CACHE"/Python/3.11.*/x64/bin/python3; do
            if [ -x "$candidate" ] && "$candidate" -I -S -c \
              'import sys; raise SystemExit(0 if sys.implementation.name == "cpython" and sys.version_info[:2] == (3, 11) else 1)'; then
              diagnostic_python=$candidate
              break
            fi
          done
          if [ -z "$diagnostic_python" ]; then
            printf 'error: runner cache has no supported CPython 3.11\n' >&2
            exit 2
          fi
          export QPERIAPT_PYTHON="$diagnostic_python"
          sh artifact/python-run.sh -c 'import sys; print(sys.version); print(sys.executable)' \
            | tee "$diagnostic_output/python.txt"
          sh artifact/python-run.sh -m unittest -v test_peer_configuration_lifetime \
            2>&1 | tee "$diagnostic_output/tests.log"
      - name: Preserve compiler diagnostics including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: peer-configuration-lifetime-${{ github.sha }}
          path: target/peer-configuration-lifetime/
          if-no-files-found: error
