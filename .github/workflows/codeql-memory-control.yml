name: CodeQL evaluator control

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  evaluate:
    name: Frozen database, ${{ matrix.profile }} evaluator
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        # Earlier allocation and cache controls did not complete SummaryStats.
        # Test whether lower concurrency reduces the retained evaluator's cache
        # pressure, keeping query plans, RAM and the execution bound identical.
        profile: [baseline, single-thread]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check archive admission, strict JSON and child cleanup
        run: sh artifact/python-run.sh -m unittest -v test_codeql_memory_control test_evidence_io
      - uses: github/codeql-action/setup-codeql@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        id: codeql
        with:
          # Keep the frozen database, queries and evaluator on their original CLI.
          tools: https://github.com/github/codeql-action/releases/download/codeql-bundle-v2.27.1/codeql-bundle-linux64.tar.gz
          languages: rust
      - name: Evaluate all 39 original queries under a 15-minute bound
        env:
          GH_TOKEN: ${{ github.token }}
          CODEQL_BINARY: ${{ steps.codeql.outputs.codeql-path }}
          CASE_PROFILE: ${{ matrix.profile }}
        run: |
          # Bound individual evaluator files as well as the Python-captured stream.
          ulimit -f 2097152
          sh artifact/python-run.sh artifact/codeql_memory_control.py \
            --codeql "$CODEQL_BINARY" --profile "$CASE_PROFILE" \
            --output "$RUNNER_TEMP/codeql-memory-$CASE_PROFILE"
      - name: Retain evidence, including failures and incomplete evaluations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-memory-${{ matrix.profile }}
          path: ${{ runner.temp }}/codeql-memory-${{ matrix.profile }}/evidence/**
          if-no-files-found: error
          retention-days: 14
