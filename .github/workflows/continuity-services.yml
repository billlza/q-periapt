name: Continuity service distribution

on:
  push:
    paths:
      - .github/workflows/continuity-services.yml
      - artifact/continuity_service*.py
      - artifact/continuity_service_license_pins.json
      - LICENSES/continuity-services/**
      - docs/continuity/SERVICE_DISTRIBUTION_0_2.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  services:
    name: continuity-services-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.98.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        id: python
        with:
          python-version: "3.14.7"
          check-latest: false
          update-environment: false
      - name: Prepare the service build host
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - name: Build and reopen the selected service distribution
        env:
          QPERIAPT_PYTHON: ${{ steps.python.outputs.python-path }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          mkdir -p "$RUNNER_TEMP/service-cargo-home"
          sh artifact/python-run.sh -m unittest discover -s artifact -p 'test_continuity_service_package.py'
          sh artifact/python-run.sh artifact/continuity_service_package.py \
            --toolchain-root "$(rustc +1.98.1 --print sysroot)" \
            --cargo-home "$RUNNER_TEMP/service-cargo-home" \
            --output target/continuity-services
          git diff --exit-code
      - name: Retain distribution and public build/readback receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: continuity-services-linux
          path: |
            target/continuity-services/*.tar.gz
            target/continuity-services/*.json
            target/continuity-services/commands/**
          if-no-files-found: error
