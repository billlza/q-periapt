name: Android platform reproduction

on:
  push:
    paths:
      - .github/workflows/android-platform-probe.yml
      - research/android-platform-probe/**

permissions:
  contents: read

concurrency:
  group: android-platform-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supervision-controls:
    runs-on: ${{ matrix.os }}
    # Allow checkout/setup time while keeping the process-control test bounded.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        id: proof_python
        with:
          python-version: "3.14.7"
          check-latest: false
          update-environment: false
      - name: Check process ownership and bounded shutdown
        timeout-minutes: 3
        env:
          QPERIAPT_PYTHON: ${{ steps.proof_python.outputs.python-path }}
        run: sh artifact/python-run.sh -m unittest -v artifact/test_android_platform_probe.py

  file-integrity-query:
    needs: supervision-controls
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        trial: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        id: proof_python
        with:
          python-version: "3.14.7"
          check-latest: false
          update-environment: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          packages: platform-tools emulator system-images;android-35;google_apis_ps16k;x86_64
      - name: Prepare this runner's KVM access
        run: |
          test -c /dev/kvm
          test ! -L /dev/kvm
          getfacl -p /dev/kvm
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
      - name: Query the platform without installing the SDK
        env:
          QPERIAPT_PYTHON: ${{ steps.proof_python.outputs.python-path }}
        run: sh artifact/python-run.sh research/android-platform-probe/run.py
      - name: Retain bounded reproduction evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: android-platform-reproduction-${{ matrix.trial }}
          path: |
            target/android-platform-probe/observation.json
            target/android-platform-probe/commands.log
          if-no-files-found: error
