name: apply Finished authentication update

on:
  push:
    branches:
      - fix/finished-authentication

permissions:
  contents: write

concurrency:
  group: apply-finished-authentication
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Apply reviewed update and remove transfer workflow
        env:
          PATCH_GZIP_BASE64: 
        run: |
          set -eu
          printf '%s' "$PATCH_GZIP_BASE64" | base64 --decode | gzip --decompress > /tmp/finished-authentication.patch
          git am --3way /tmp/finished-authentication.patch
          rm -f .github/workflows/apply-finished-authentication.yml
          git add -A
          git diff --cached --check
          git config user.name "Repository Maintenance"
          git config user.email "repository-maintenance@users.noreply.github.com"
          git commit -m "Remove transfer workflow"
          git push origin HEAD:fix/finished-authentication
