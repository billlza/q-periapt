name: Directory lease contract

on:
  pull_request:
    paths:
      - .github/workflows/directory-lease-contract.yml
      - research/continuity-identity-candidate/**
      - research/continuity-reference-app/**
      - research/continuity-openssl-peer/**
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: directory-lease-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: directory-${{ matrix.check }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        check: [format, behavior]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          sparse-checkout: |
            .cargo
            crates
            ctstats
            models
            services
            bindings
            LICENSES
            research/continuity-identity-candidate
            research/continuity-reference-app
            research/continuity-openssl-peer
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.98.1
          components: rustfmt
      - name: Compare canonical Rust formatting on the submitted sources
        if: matrix.check == 'format'
        shell: bash
        run: |
          set -euo pipefail
          # Read-only job; no repository writes or formatting of the behavior lane.
          for crate in research/continuity-identity-candidate research/continuity-reference-app research/continuity-openssl-peer/native; do
            cargo +1.98.1 fmt --manifest-path "$crate/Cargo.toml"
          done
          git -c color.ui=false diff --no-ext-diff --exit-code -- '*.rs'
      - name: Prepare native OpenSSL on the supported Linux host
        if: matrix.check == 'behavior'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - name: Execute signed assignments, persistent reconciliation and the real directory CLI
        if: matrix.check == 'behavior'
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/directory-lease-build
          RUSTFLAGS: -D warnings
        shell: bash
        run: |
          set -euo pipefail
          check_tests() {
            local label="$1"; shift
            "$@" 2>&1 | tee "$RUNNER_TEMP/$label.log"
            grep -Eq '^test result: ok\. [1-9][0-9]* passed; 0 failed;' "$RUNNER_TEMP/$label.log"
          }
          sdk=research/continuity-identity-candidate/Cargo.toml
          app=research/continuity-reference-app/Cargo.toml
          check_tests signed cargo +1.98.1 test --locked --manifest-path "$sdk" --lib directory_
          check_tests ledger cargo +1.98.1 test --locked --manifest-path "$app" --lib directory_ledger::tests::
          check_tests commands cargo +1.98.1 test --locked --manifest-path "$app" --test native_device actual_cli_verifies_one_time_publication_without_opening_state
