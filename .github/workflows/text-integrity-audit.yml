name: Text integrity audit

on:
  push:
    branches:
      - audit/text-integrity

permissions:
  contents: read

concurrency:
  group: text-integrity-audit
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out exact source snapshot
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: 391d6ef3fc04f153eeca31b2560f1d8741570bf5

      - name: Scan tracked blobs byte-for-byte
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "391d6ef3fc04f153eeca31b2560f1d8741570bf5"
          mkdir -p target/text-integrity-audit
          /usr/bin/python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import pathlib
          import subprocess
          import unicodedata

          ROOT = pathlib.Path.cwd()
          OUT = ROOT / "target" / "text-integrity-audit"
          SOURCE_COMMIT = "391d6ef3fc04f153eeca31b2560f1d8741570bf5"

          def tracked_entries() -> list[tuple[str, str]]:
              raw = subprocess.check_output(["git", "ls-files", "-s", "-z"])
              entries: list[tuple[str, str]] = []
              for record in raw.split(b"\0"):
                  if not record:
                      continue
                  metadata, raw_path = record.split(b"\t", 1)
                  mode = metadata.split(b" ", 1)[0].decode("ascii")
                  path = os.fsdecode(raw_path)
                  entries.append((mode, path))
              return entries

          def blob_bytes(mode: str, path: str) -> bytes:
              full = ROOT / path
              if mode == "120000":
                  return os.readlink(full).encode("utf-8", "surrogateescape")
              if mode == "160000":
                  return b""
              return full.read_bytes()

          attribution_terms = [
              b"cl" + b"aude",
              b"anth" + b"ropic",
              b"noreply@" + b"anth" + b"ropic.com",
              b"generated with " + b"cl" + b"aude",
              b"generated by " + b"cl" + b"aude",
          ]

          named_suspicious = {
              0x00AD: "SOFT HYPHEN",
              0x034F: "COMBINING GRAPHEME JOINER",
              0x061C: "ARABIC LETTER MARK",
              0x180E: "MONGOLIAN VOWEL SEPARATOR",
              0x200B: "ZERO WIDTH SPACE",
              0x200C: "ZERO WIDTH NON-JOINER",
              0x200D: "ZERO WIDTH JOINER",
              0x200E: "LEFT-TO-RIGHT MARK",
              0x200F: "RIGHT-TO-LEFT MARK",
              0x202A: "LEFT-TO-RIGHT EMBEDDING",
              0x202B: "RIGHT-TO-LEFT EMBEDDING",
              0x202C: "POP DIRECTIONAL FORMATTING",
              0x202D: "LEFT-TO-RIGHT OVERRIDE",
              0x202E: "RIGHT-TO-LEFT OVERRIDE",
              0x2060: "WORD JOINER",
              0x2061: "FUNCTION APPLICATION",
              0x2062: "INVISIBLE TIMES",
              0x2063: "INVISIBLE SEPARATOR",
              0x2064: "INVISIBLE PLUS",
              0x2066: "LEFT-TO-RIGHT ISOLATE",
              0x2067: "RIGHT-TO-LEFT ISOLATE",
              0x2068: "FIRST STRONG ISOLATE",
              0x2069: "POP DIRECTIONAL ISOLATE",
              0xFEFF: "ZERO WIDTH NO-BREAK SPACE/BOM",
              0xFFF9: "INTERLINEAR ANNOTATION ANCHOR",
              0xFFFA: "INTERLINEAR ANNOTATION SEPARATOR",
              0xFFFB: "INTERLINEAR ANNOTATION TERMINATOR",
          }
          for cp in range(0x206A, 0x2070):
              named_suspicious[cp] = unicodedata.name(chr(cp), "DEPRECATED FORMAT CONTROL")

          def codepoint_kind(cp: int, index: int) -> tuple[str, str] | None:
              if cp == 0xFEFF and index == 0:
                  return None
              if cp in named_suspicious:
                  severity = "review" if cp in {0x200C, 0x200D} else "high"
                  return severity, named_suspicious[cp]
              if 0xE0000 <= cp <= 0xE007F:
                  return "high", "UNICODE TAG CHARACTER"
              if 0xFE00 <= cp <= 0xFE0F or 0xE0100 <= cp <= 0xE01EF:
                  return "review", "VARIATION SELECTOR"
              category = unicodedata.category(chr(cp))
              if category == "Co":
                  return "review", "PRIVATE USE CHARACTER"
              if category == "Cf":
                  return "review", unicodedata.name(chr(cp), "FORMAT CHARACTER")
              return None

          def decode_text(data: bytes) -> tuple[str, str, int] | None:
              if data.startswith(b"\xef\xbb\xbf"):
                  return data[3:].decode("utf-8"), "utf-8", 3
              if data.startswith(b"\xff\xfe"):
                  return data[2:].decode("utf-16-le"), "utf-16-le", 2
              if data.startswith(b"\xfe\xff"):
                  return data[2:].decode("utf-16-be"), "utf-16-be", 2
              try:
                  return data.decode("utf-8"), "utf-8", 0
              except UnicodeDecodeError:
                  return None

          def escaped_context(text: str, index: int, radius: int = 24) -> str:
              left = max(0, index - radius)
              right = min(len(text), index + radius + 1)
              return text[left:right].encode("unicode_escape").decode("ascii")

          findings: list[dict[str, object]] = []
          file_records: list[dict[str, object]] = []
          total_bytes = 0
          entries = tracked_entries()

          for mode, path in entries:
              data = blob_bytes(mode, path)
              total_bytes += len(data)
              digest = hashlib.sha256(data).hexdigest()
              decoded = decode_text(data)
              file_records.append(
                  {
                      "path": path,
                      "mode": mode,
                      "size": len(data),
                      "sha256": digest,
                      "decoded_text": decoded is not None,
                  }
              )

              lowered = data.lower()
              for term in attribution_terms:
                  start = 0
                  while True:
                      pos = lowered.find(term.lower(), start)
                      if pos < 0:
                          break
                      findings.append(
                          {
                              "path": path,
                              "kind": "attribution_marker",
                              "severity": "high",
                              "byte_offset": pos,
                              "term_ascii": term.decode("ascii"),
                              "context_hex": data[max(0, pos - 24):pos + len(term) + 24].hex(),
                          }
                      )
                      start = pos + 1

              if decoded is None:
                  continue
              text, encoding, byte_offset = decoded
              line = 1
              column = 1
              offset = byte_offset
              for index, char in enumerate(text):
                  cp = ord(char)
                  classified = codepoint_kind(cp, index)
                  if classified is not None:
                      severity, name = classified
                      findings.append(
                          {
                              "path": path,
                              "kind": "unicode_control_or_invisible",
                              "severity": severity,
                              "codepoint": f"U+{cp:04X}",
                              "unicode_name": name,
                              "unicode_category": unicodedata.category(char),
                              "byte_offset": offset,
                              "line": line,
                              "column": column,
                              "encoding": encoding,
                              "context_escaped": escaped_context(text, index),
                          }
                      )
                  if cp < 0x20 and char not in {"\t", "\n", "\r", "\f"}:
                      findings.append(
                          {
                              "path": path,
                              "kind": "unexpected_ascii_control",
                              "severity": "high",
                              "codepoint": f"U+{cp:04X}",
                              "byte_offset": offset,
                              "line": line,
                              "column": column,
                              "encoding": encoding,
                              "context_escaped": escaped_context(text, index),
                          }
                      )
                  encoded = char.encode(encoding)
                  offset += len(encoded)
                  if char == "\n":
                      line += 1
                      column = 1
                  else:
                      column += 1

              path_text = path
              for index, char in enumerate(path_text):
                  classified = codepoint_kind(ord(char), index)
                  if classified is not None:
                      severity, name = classified
                      findings.append(
                          {
                              "path": path,
                              "kind": "filename_unicode_control_or_invisible",
                              "severity": severity,
                              "codepoint": f"U+{ord(char):04X}",
                              "unicode_name": name,
                              "character_index": index,
                          }
                      )

          report = {
              "schema_version": 1,
              "source_commit": SOURCE_COMMIT,
              "tracked_entries": len(entries),
              "total_blob_bytes": total_bytes,
              "finding_count": len(findings),
              "high_count": sum(1 for item in findings if item["severity"] == "high"),
              "review_count": sum(1 for item in findings if item["severity"] == "review"),
              "findings": findings,
              "files": file_records,
          }
          (OUT / "report.json").write_text(
              json.dumps(report, indent=2, sort_keys=True, ensure_ascii=True) + "\n",
              encoding="utf-8",
          )
          summary_lines = [
              f"source_commit={SOURCE_COMMIT}",
              f"tracked_entries={len(entries)}",
              f"total_blob_bytes={total_bytes}",
              f"finding_count={len(findings)}",
              f"high_count={report['high_count']}",
              f"review_count={report['review_count']}",
          ]
          for item in findings:
              summary_lines.append(json.dumps(item, sort_keys=True, ensure_ascii=True))
          (OUT / "summary.txt").write_text("\n".join(summary_lines) + "\n", encoding="utf-8")
          print("\n".join(summary_lines[:6]))
          PY

      - name: Upload audit report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: text-integrity-audit
          path: target/text-integrity-audit
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
