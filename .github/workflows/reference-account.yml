name: Continuity reference account

on:
  push:
    paths:
      - .github/workflows/reference-account.yml
      - research/continuity-reference-app/**
      - research/continuity-openssl-peer/qperiapt_continuity_reference/**
      - research/continuity-openssl-peer/tests/enrollment_exchange.py
      - research/continuity-openssl-peer/tests/enrollment_client.py
      - research/continuity-openssl-peer/tests/enrollment_extension.py
      - research/continuity-openssl-peer/tests/account_root_*.py
      - research/continuity-openssl-peer/tests/account_authority*.py
      - research/continuity-openssl-peer/tests/root_bound_client.py
      - research/continuity-openssl-peer/tests/root_adoption_journal.py
      - research/continuity-openssl-peer/root_adoption_checks.py
      - research/continuity-openssl-peer/root_adoption_client_fixture.py
      - research/continuity-openssl-peer/root_child_fixture.py
      - research/continuity-openssl-peer/root_target_fixture.py
      - research/continuity-openssl-peer/root_retirement*.py
      - research/continuity-openssl-peer/root_successor*.py
      - research/continuity-openssl-peer/root_transition*.py
      - research/continuity-openssl-peer/tests/root_successor_origin.py
      - research/continuity-openssl-peer/enrollment_session_checks.py
      - research/continuity-openssl-peer/native/**
      - research/continuity-openssl-peer/tests/network.py
      - research/continuity-openssl-peer/tests/mailbox.py
      - research/continuity-openssl-peer/pyproject.toml
      - research/continuity-openssl-peer/*requirements.txt
      - artifact/continuity_host_exchange.py
      - artifact/continuity_host_native_exchange.py
      - artifact/test_continuity_host_native_exchange.py
      - artifact/continuity_host_network.py
      - artifact/test_continuity_host_network.py
      - artifact/continuity_host_cli*.py
      - artifact/test_continuity_host_cli*.py
      - artifact/continuity_host_witness*.py
      - artifact/test_continuity_host_witness*.py
      - artifact/continuity_host_replacement*.py
      - artifact/continuity_host_account*.py
      - artifact/test_continuity_host_account*.py
      - artifact/test_continuity_host_replacement.py
      - artifact/continuity_host_roster_policy.py
      - artifact/continuity_host_roster_credential.py
      - artifact/continuity_host_peer_policy.py
      - artifact/continuity_host_peer_credential.py
      - artifact/continuity_host_peer_reapproval.py
      - artifact/continuity_host_roster.py
      - artifact/test_continuity_host_roster.py
      - artifact/continuity_independent_python*.py
      - artifact/continuity_independent_install.py
      - artifact/test_reference_account_workflow.py
      - crates/**
      - research/continuity-identity-candidate/src/**
      - research/continuity-identity-candidate/Cargo.toml
  pull_request:
    paths:
      - .github/workflows/reference-account.yml
      - research/continuity-reference-app/**
      - research/continuity-openssl-peer/qperiapt_continuity_reference/**
      - research/continuity-openssl-peer/tests/enrollment_exchange.py
      - research/continuity-openssl-peer/tests/enrollment_client.py
      - research/continuity-openssl-peer/tests/enrollment_extension.py
      - research/continuity-openssl-peer/tests/account_root_*.py
      - research/continuity-openssl-peer/tests/account_authority*.py
      - research/continuity-openssl-peer/tests/root_bound_client.py
      - research/continuity-openssl-peer/tests/root_adoption_journal.py
      - research/continuity-openssl-peer/root_adoption_checks.py
      - research/continuity-openssl-peer/root_adoption_client_fixture.py
      - research/continuity-openssl-peer/root_child_fixture.py
      - research/continuity-openssl-peer/root_target_fixture.py
      - research/continuity-openssl-peer/root_retirement*.py
      - research/continuity-openssl-peer/root_successor*.py
      - research/continuity-openssl-peer/root_transition*.py
      - research/continuity-openssl-peer/tests/root_successor_origin.py
      - research/continuity-openssl-peer/enrollment_session_checks.py
      - research/continuity-openssl-peer/native/**
      - research/continuity-openssl-peer/tests/network.py
      - research/continuity-openssl-peer/tests/mailbox.py
      - research/continuity-openssl-peer/pyproject.toml
      - research/continuity-openssl-peer/*requirements.txt
      - artifact/continuity_host_exchange.py
      - artifact/continuity_host_native_exchange.py
      - artifact/test_continuity_host_native_exchange.py
      - artifact/continuity_host_network.py
      - artifact/test_continuity_host_network.py
      - artifact/continuity_host_cli*.py
      - artifact/test_continuity_host_cli*.py
      - artifact/continuity_host_witness*.py
      - artifact/test_continuity_host_witness*.py
      - artifact/continuity_host_replacement*.py
      - artifact/continuity_host_account*.py
      - artifact/test_continuity_host_account*.py
      - artifact/test_continuity_host_replacement.py
      - artifact/continuity_host_roster_policy.py
      - artifact/continuity_host_roster_credential.py
      - artifact/continuity_host_peer_policy.py
      - artifact/continuity_host_peer_credential.py
      - artifact/continuity_host_peer_reapproval.py
      - artifact/continuity_host_roster.py
      - artifact/test_continuity_host_roster.py
      - artifact/continuity_independent_python*.py
      - artifact/continuity_independent_install.py
      - artifact/test_reference_account_workflow.py
      - crates/**
      - research/continuity-identity-candidate/src/**
      - research/continuity-identity-candidate/Cargo.toml
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTFLAGS: "-D warnings"
  CARGO_TERM_COLOR: never
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  account:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
          - os: macos-15
            arch: arm64
    runs-on: ${{ matrix.os }}
    # Includes cold builds of the account host and independent native counterpart.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "26.10.0"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        id: python
        with:
          python-version: "3.14.7"
          check-latest: false
          update-environment: false
      - name: Prepare native OpenSSL on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - name: Select native OpenSSL on Apple Silicon
        if: runner.os == 'macOS'
        run: |
          openssl_prefix=$(brew --prefix openssl@3)
          echo "OPENSSL_DIR=$openssl_prefix" >> "$GITHUB_ENV"
      - name: Verify the source and supported host
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$(uname -m)" = "$EXPECTED_ARCH"
          mkdir -p target/reference-account-ci
          git rev-parse HEAD > target/reference-account-ci/source-head.txt
          rustc -vV > target/reference-account-ci/rustc.txt
          uname -a > target/reference-account-ci/host.txt
          pkg-config --modversion openssl > target/reference-account-ci/openssl.txt
          node --version > target/reference-account-ci/node.txt
      - name: Verify browser recovery and exact integer transport
        run: |
          for module in research/continuity-reference-app/web/*.mjs; do
            node --check "$module"
          done
          node --input-type=module --check < research/continuity-reference-app/web/app.js
          node --test --test-reporter=tap research/continuity-reference-app/tests/web/*.test.mjs \
            > target/reference-account-ci/web-tests.stdout 2> target/reference-account-ci/web-tests.stderr
      - name: Verify account, enrollment transactions and process recovery
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/reference-account-build
        run: |
          manifest=research/continuity-reference-app/Cargo.toml
          cargo fmt --manifest-path "$manifest" -- --check \
            > target/reference-account-ci/fmt.stdout 2> target/reference-account-ci/fmt.stderr
          cargo test --locked --manifest-path "$manifest" \
            > target/reference-account-ci/tests.stdout 2> target/reference-account-ci/tests.stderr
          cargo clippy --locked --all-targets --manifest-path "$manifest" -- -D warnings \
            > target/reference-account-ci/clippy.stdout 2> target/reference-account-ci/clippy.stderr
          cargo build --locked --release --manifest-path "$manifest" \
            > target/reference-account-ci/build.stdout 2> target/reference-account-ci/build.stderr
          cargo build --locked --release --manifest-path "$manifest" --example inbox-crash-probe --example account-client-probe --example credential-recovery-probe \
            > target/reference-account-ci/inbox-probe-build.stdout 2> target/reference-account-ci/inbox-probe-build.stderr
          cargo test --locked --release --manifest-path "$manifest" \
            > target/reference-account-ci/release-tests.stdout 2> target/reference-account-ci/release-tests.stderr
          cargo test --locked --release --manifest-path "$manifest" --lib --no-run --message-format=json \
            > target/reference-account-ci/root-test-artifacts.jsonl 2> target/reference-account-ci/root-test-artifacts.stderr
          QPERIAPT_INDEPENDENT_ROOT_REGISTRY_FIXTURE="$PWD/target/reference-account-ci/root-registry-inputs" \
            cargo test --locked --release --manifest-path "$manifest" --lib original_root_registry_fixture_child -- --nocapture \
            > target/reference-account-ci/root-registry-inputs.stdout 2> target/reference-account-ci/root-registry-inputs.stderr
          reference_build="$CARGO_TARGET_DIR"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/reference-identity-build"
          native_manifest=research/continuity-identity-candidate/Cargo.toml
          cargo fmt --manifest-path "$native_manifest" -- --check \
            > target/reference-account-ci/native-signers-fmt.stdout 2> target/reference-account-ci/native-signers-fmt.stderr
          cargo test --locked --manifest-path "$native_manifest" --lib crypto:: \
            > target/reference-account-ci/native-signers-tests.stdout 2> target/reference-account-ci/native-signers-tests.stderr
          for scope in preinstallation roster public_admission replacement_request; do
            cargo test --locked --manifest-path "$native_manifest" --lib "enrollment::tests::$scope" -- --test-threads=1 \
              > "target/reference-account-ci/native-$scope-tests.stdout" 2> "target/reference-account-ci/native-$scope-tests.stderr"
          done
          cargo test --locked --manifest-path "$native_manifest" --test historical_identity \
            > target/reference-account-ci/native-historical-identity.stdout 2> target/reference-account-ci/native-historical-identity.stderr
          cargo clippy --locked --manifest-path "$native_manifest" --lib -- -D warnings \
            > target/reference-account-ci/native-signers-clippy.stdout 2> target/reference-account-ci/native-signers-clippy.stderr
          export CARGO_TARGET_DIR="$reference_build"
          shasum -a 256 "$CARGO_TARGET_DIR/release/q-periapt-continuity-reference-app" \
            "$CARGO_TARGET_DIR/release/q-periapt-native-device" \
            "$CARGO_TARGET_DIR/release/q-periapt-native-session" \
            "$CARGO_TARGET_DIR/release/q-periapt-native-outgoing" \
            "$CARGO_TARGET_DIR/release/q-periapt-continuity-witness" \
            "$CARGO_TARGET_DIR/release/examples/inbox-crash-probe" \
            "$CARGO_TARGET_DIR/release/examples/account-client-probe" \
            "$CARGO_TARGET_DIR/release/examples/credential-recovery-probe" \
            > target/reference-account-ci/binary.sha256
          cp research/continuity-reference-app/Cargo.lock target/reference-account-ci/Cargo.lock
          git diff --exit-code
      - name: Build and consume the independent enrollment exchange wheel
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/reference-account-build
          PEER_PYTHON: ${{ steps.python.outputs.python-path }}
          QPERIAPT_PYTHON: ${{ steps.python.outputs.python-path }}
          POLICY_PUBLISHER: ${{ runner.temp }}/reference-account-build/release/q-periapt-policy-publisher
          SDK_POLICY_AUTHORITY: ${{ runner.temp }}/reference-account-build/release/q-periapt-sdk-policy-authority
          NATIVE_DEVICE: ${{ runner.temp }}/reference-account-build/release/q-periapt-native-device
          NATIVE_SESSION: ${{ runner.temp }}/reference-account-build/release/q-periapt-native-session
          NATIVE_OUTGOING: ${{ runner.temp }}/reference-account-build/release/q-periapt-native-outgoing
          CONTINUITY_WITNESS: ${{ runner.temp }}/reference-account-build/release/q-periapt-continuity-witness
          ACCOUNT_HOST: ${{ runner.temp }}/reference-account-build/release/q-periapt-continuity-reference-app
          ACCOUNT_CLIENT: ${{ runner.temp }}/reference-account-build/release/examples/account-client-probe
          CREDENTIAL_RECOVERY_PROBE: ${{ runner.temp }}/reference-account-build/release/examples/credential-recovery-probe
          CRASH_PROBE: ${{ runner.temp }}/reference-account-build/release/examples/inbox-crash-probe
        run: |
          sh artifact/python-run.sh -m unittest discover -s artifact -p 'test_continuity_host_native_exchange.py' \
            > target/reference-account-ci/native-exchange-receipt-tests.stdout 2> target/reference-account-ci/native-exchange-receipt-tests.stderr
          sh artifact/python-run.sh -m unittest discover -s artifact -p 'test_continuity_host_network.py' \
            > target/reference-account-ci/network-receipt-tests.stdout 2> target/reference-account-ci/network-receipt-tests.stderr
          sh artifact/python-run.sh -m unittest discover -s artifact -p 'test_continuity_host_cli*.py' \
            > target/reference-account-ci/cli-receipt-tests.stdout 2> target/reference-account-ci/cli-receipt-tests.stderr
          sh artifact/python-run.sh -m unittest discover -s artifact -p 'test_continuity_host_witness*.py' \
            > target/reference-account-ci/witness-receipt-tests.stdout 2> target/reference-account-ci/witness-receipt-tests.stderr
          sh artifact/python-run.sh -m unittest discover -s artifact -p 'test_continuity_host_replacement.py' \
            > target/reference-account-ci/replacement-receipt-tests.stdout 2> target/reference-account-ci/replacement-receipt-tests.stderr
          sh artifact/python-run.sh -m unittest discover -s artifact -p 'test_continuity_host_account*.py' \
            > target/reference-account-ci/account-receipt-tests.stdout 2> target/reference-account-ci/account-receipt-tests.stderr
          sh artifact/python-run.sh -m unittest discover -s artifact -p 'test_continuity_host_roster.py' \
            > target/reference-account-ci/roster-receipt-tests.stdout 2> target/reference-account-ci/roster-receipt-tests.stderr
          "$PEER_PYTHON" -I -m venv "$RUNNER_TEMP/reference-wheel-build"
          "$RUNNER_TEMP/reference-wheel-build/bin/python" -I -m pip install \
            --isolated --disable-pip-version-check --index-url https://pypi.org/simple \
            --only-binary=:all: --no-deps --require-hashes \
            -r research/continuity-openssl-peer/build-requirements.txt \
            > target/reference-account-ci/wheel-backend.stdout 2> target/reference-account-ci/wheel-backend.stderr
          "$PEER_PYTHON" -I -m pip install --isolated --disable-pip-version-check \
            --index-url https://pypi.org/simple --only-binary=:all: --no-deps --require-hashes \
            --target "$RUNNER_TEMP/reference-provider" -r research/continuity-openssl-peer/requirements.txt \
            > target/reference-account-ci/provider.stdout 2> target/reference-account-ci/provider.stderr
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export SOURCE_DATE_EPOCH
          "$RUNNER_TEMP/reference-wheel-build/bin/python" -I -m pip wheel \
            --isolated --disable-pip-version-check --no-index --no-deps --no-build-isolation \
            --wheel-dir "$RUNNER_TEMP/reference-wheel" research/continuity-openssl-peer \
            > target/reference-account-ci/wheel-build.stdout 2> target/reference-account-ci/wheel-build.stderr
          sh artifact/python-run.sh artifact/continuity_host_exchange.py \
            --wheel "$RUNNER_TEMP/reference-wheel/qperiapt_continuity_reference-0.0.0-py3-none-any.whl" \
            --provider-root "$RUNNER_TEMP/reference-provider" \
            --publisher "$POLICY_PUBLISHER" \
            --sdk-authority "$SDK_POLICY_AUTHORITY" \
            --native-device "$NATIVE_DEVICE" \
            --native-session "$NATIVE_SESSION" \
            --native-outgoing "$NATIVE_OUTGOING" \
            --crash-probe "$CRASH_PROBE" \
            --witness "$CONTINUITY_WITNESS" \
            --account-host "$ACCOUNT_HOST" \
            --account-client "$ACCOUNT_CLIENT" \
            --credential-recovery-probe "$CREDENTIAL_RECOVERY_PROBE" \
            --output target/reference-account-ci/exchange \
            > target/reference-account-ci/exchange.stdout 2> target/reference-account-ci/exchange.stderr
          installed_reference=$(jq -er '.outside_root' target/reference-account-ci/exchange/RESULT.json)
          sh artifact/python-run.sh research/continuity-reference-app/tests/witness_root_operator.py \
            --witness "$CONTINUITY_WITNESS" \
            --test-artifacts target/reference-account-ci/root-test-artifacts.jsonl \
            --implementation-root "$installed_reference/installed" \
            --provider-root "$RUNNER_TEMP/reference-provider" \
            --output "$PWD/target/reference-account-ci/root-operator" \
            > target/reference-account-ci/root-operator.stdout 2> target/reference-account-ci/root-operator.stderr
          sh artifact/python-run.sh research/continuity-openssl-peer/tests/account_root_protocol.py \
            --operator-output "$PWD/target/reference-account-ci/root-operator" \
            --implementation-root "$installed_reference/installed" \
            --provider-root "$RUNNER_TEMP/reference-provider" \
            --output "$PWD/target/reference-account-ci/root-protocol" \
            > target/reference-account-ci/root-protocol.stdout 2> target/reference-account-ci/root-protocol.stderr
          sh artifact/python-run.sh research/continuity-openssl-peer/tests/account_authority.py \
            --operator-output "$PWD/target/reference-account-ci/root-registry-inputs" \
            --implementation-root "$installed_reference/installed" \
            --provider-root "$RUNNER_TEMP/reference-provider" \
            --scope installed --output "$PWD/target/reference-account-ci/root-authority" \
            > target/reference-account-ci/root-authority.stdout 2> target/reference-account-ci/root-authority.stderr
          cargo build --locked --release --manifest-path research/continuity-openssl-peer/native/Cargo.toml \
            > target/reference-account-ci/root-counterpart-build.stdout 2> target/reference-account-ci/root-counterpart-build.stderr
          root_native_test=$(jq -er -s '[.[] | select(.reason == "compiler-artifact" and .target.name == "q_periapt_continuity_reference_app" and .profile.test == true and .executable != null)] | if length == 1 then .[0].executable else error("expected one original root test executable") end' target/reference-account-ci/root-test-artifacts.jsonl)
          QPERIAPT_INDEPENDENT_ROOT_REGISTRY_FIXTURE="$PWD/target/reference-account-ci/root-client-inputs" \
            "$root_native_test" --exact auth::enrollment_tests::authority::cutover::fixtures::original_root_registry_fixture_child --nocapture \
            > target/reference-account-ci/root-client-inputs.stdout 2> target/reference-account-ci/root-client-inputs.stderr
          sh artifact/python-run.sh research/continuity-openssl-peer/tests/root_bound_client.py \
            --implementation-root "$installed_reference/installed" --provider-root "$RUNNER_TEMP/reference-provider" \
            --private-output "$RUNNER_TEMP/root-bound-client" --root-fixture "$PWD/target/reference-account-ci/root-client-inputs" \
            > target/reference-account-ci/root-bound-client.stdout 2> target/reference-account-ci/root-bound-client.stderr
          cp "$RUNNER_TEMP/root-bound-client/RESULT.json" target/reference-account-ci/root-bound-client.json
          sh artifact/python-run.sh research/continuity-openssl-peer/enrollment_session_checks.py \
            --implementation-root "$installed_reference/installed" --provider-root "$RUNNER_TEMP/reference-provider" \
            --native "$CARGO_TARGET_DIR/release/q-periapt-independent-peer-counterpart" --account-root-binding \
            --output "$PWD/target/reference-account-ci/root-bound-session" \
            > target/reference-account-ci/root-bound-session.stdout 2> target/reference-account-ci/root-bound-session.stderr
          sh artifact/python-run.sh research/continuity-openssl-peer/tests/root_adoption_journal.py \
            --implementation-root "$installed_reference/installed" --provider-root "$RUNNER_TEMP/reference-provider" \
            --private-output "$RUNNER_TEMP/root-adoption-journal" \
            > target/reference-account-ci/root-adoption-journal.stdout 2> target/reference-account-ci/root-adoption-journal.stderr
          cp "$RUNNER_TEMP/root-adoption-journal/RESULT.json" target/reference-account-ci/root-adoption-journal.json
          sh artifact/python-run.sh research/continuity-openssl-peer/root_adoption_checks.py \
            --implementation-root "$installed_reference/installed" --provider-root "$RUNNER_TEMP/reference-provider" \
            --native "$CARGO_TARGET_DIR/release/q-periapt-independent-peer-counterpart" \
            --output "$PWD/target/reference-account-ci/root-adoption-session" \
            > target/reference-account-ci/root-adoption-session.stdout 2> target/reference-account-ci/root-adoption-session.stderr
          for mode in account-root-adoption root-adoption-cuts root-adoption-expiry; do
            sh artifact/python-run.sh research/continuity-openssl-peer/enrollment_session_checks.py \
              --implementation-root "$installed_reference/installed" --provider-root "$RUNNER_TEMP/reference-provider" \
              --native "$CARGO_TARGET_DIR/release/q-periapt-independent-peer-counterpart" --"$mode" \
              --output "$PWD/target/reference-account-ci/$mode" \
              > "target/reference-account-ci/$mode.stdout" 2> "target/reference-account-ci/$mode.stderr"
          done
          for mode in steady ordinary-before ordinary-after credential credential-terminal credential-closed roster roster-terminal roster-closed policy policy-terminal policy-closed partial partial-bound partial-intent tamper-head tamper-binding tamper-intent; do
            sh artifact/python-run.sh research/continuity-openssl-peer/enrollment_session_checks.py \
              --implementation-root "$installed_reference/installed" --provider-root "$RUNNER_TEMP/reference-provider" \
              --native "$CARGO_TARGET_DIR/release/q-periapt-independent-peer-counterpart" --root-child-inspection "$mode" \
              --output "$PWD/target/reference-account-ci/root-child-$mode" \
              > "target/reference-account-ci/root-child-$mode.stdout" 2> "target/reference-account-ci/root-child-$mode.stderr"
          done
          for mode in steady ordinary-before ordinary-after credential credential-terminal credential-closed partial partial-bound partial-intent; do
            sh artifact/python-run.sh research/continuity-openssl-peer/enrollment_session_checks.py \
              --implementation-root "$installed_reference/installed" --provider-root "$RUNNER_TEMP/reference-provider" \
              --native "$CARGO_TARGET_DIR/release/q-periapt-independent-peer-counterpart" --root-retirement "$mode" \
              --output "$PWD/target/reference-account-ci/root-retirement-$mode" \
              > "target/reference-account-ci/root-retirement-$mode.stdout" 2> "target/reference-account-ci/root-retirement-$mode.stderr"
          done
          sh artifact/python-run.sh research/continuity-openssl-peer/enrollment_session_checks.py \
            --implementation-root "$installed_reference/installed" --provider-root "$RUNNER_TEMP/reference-provider" \
            --native "$CARGO_TARGET_DIR/release/q-periapt-independent-peer-counterpart" --root-retirement-cuts \
            --output "$PWD/target/reference-account-ci/root-retirement-cuts" \
            > target/reference-account-ci/root-retirement-cuts.stdout 2> target/reference-account-ci/root-retirement-cuts.stderr
          for mode in steady credential before after parent ready peer peer-credential peer-before peer-after; do
            sh artifact/python-run.sh research/continuity-openssl-peer/enrollment_session_checks.py \
              --implementation-root "$installed_reference/installed" --provider-root "$RUNNER_TEMP/reference-provider" \
              --native "$CARGO_TARGET_DIR/release/q-periapt-independent-peer-counterpart" --root-successor "$mode" \
              --output "$PWD/target/reference-account-ci/root-successor-$mode" \
              > "target/reference-account-ci/root-successor-$mode.stdout" 2> "target/reference-account-ci/root-successor-$mode.stderr"
          done
          for mode in peer peer-credential peer-before peer-after; do
            sh artifact/python-run.sh research/continuity-openssl-peer/enrollment_session_checks.py \
              --implementation-root "$installed_reference/installed" --provider-root "$RUNNER_TEMP/reference-provider" \
              --native "$CARGO_TARGET_DIR/release/q-periapt-independent-peer-counterpart" --root-successor-process-restart "$mode" \
              --output "$PWD/target/reference-account-ci/root-successor-process-restart-$mode" \
              > "target/reference-account-ci/root-successor-process-restart-$mode.stdout" 2> "target/reference-account-ci/root-successor-process-restart-$mode.stderr"
          done
          root_cut_pids=()
          for phase in configuration child registration ready activation; do
            sh artifact/python-run.sh research/continuity-openssl-peer/enrollment_session_checks.py \
              --implementation-root "$installed_reference/installed" --provider-root "$RUNNER_TEMP/reference-provider" \
              --native "$CARGO_TARGET_DIR/release/q-periapt-independent-peer-counterpart" --root-successor-cuts "$phase" \
              --output "$PWD/target/reference-account-ci/root-successor-cuts-$phase" \
              > "target/reference-account-ci/root-successor-cuts-$phase.stdout" 2> "target/reference-account-ci/root-successor-cuts-$phase.stderr" &
            root_cut_pids+=("$!")
          done
          root_cut_status=0
          for root_cut_pid in "${root_cut_pids[@]}"; do
            if ! wait "$root_cut_pid"; then root_cut_status=1; fi
          done
          test "$root_cut_status" -eq 0
          sh artifact/python-run.sh research/continuity-openssl-peer/enrollment_session_checks.py \
            --implementation-root "$installed_reference/installed" --provider-root "$RUNNER_TEMP/reference-provider" \
            --native "$CARGO_TARGET_DIR/release/q-periapt-independent-peer-counterpart" --root-successor-cancellation \
            --output "$PWD/target/reference-account-ci/root-successor-cancellation" \
            > target/reference-account-ci/root-successor-cancellation.stdout 2> target/reference-account-ci/root-successor-cancellation.stderr
          sh artifact/python-run.sh research/continuity-openssl-peer/tests/root_successor_origin.py \
            --implementation-root "$installed_reference/installed" --provider-root "$RUNNER_TEMP/reference-provider" \
            --retirement-result "$PWD/target/reference-account-ci/root-retirement-steady/RESULT.json" \
            --output "$PWD/target/reference-account-ci/root-successor-origin" \
            > target/reference-account-ci/root-successor-origin.stdout 2> target/reference-account-ci/root-successor-origin.stderr
          git diff --exit-code
      - name: Retain build and regression results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reference-account-${{ matrix.os }}
          path: target/reference-account-ci/
          if-no-files-found: error

  root-continuation:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
          - os: macos-15
            arch: arm64
    runs-on: ${{ matrix.os }}
    # Separate the new complete lifecycle workload from the existing account job.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        id: python
        with:
          python-version: "3.14.7"
          check-latest: false
          update-environment: false
      - name: Prepare native OpenSSL on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - name: Select native OpenSSL on Apple Silicon
        if: runner.os == 'macOS'
        run: |
          openssl_prefix=$(brew --prefix openssl@3)
          echo "OPENSSL_DIR=$openssl_prefix" >> "$GITHUB_ENV"
      - name: Verify the source and supported host
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$(uname -m)" = "$EXPECTED_ARCH"
          mkdir -p target/reference-root-ci
          git rev-parse HEAD > target/reference-root-ci/source-head.txt
          rustc -vV > target/reference-root-ci/rustc.txt
          uname -a > target/reference-root-ci/host.txt
          pkg-config --modversion openssl > target/reference-root-ci/openssl.txt
      - name: Verify independent root continuation from the installed wheel
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/reference-root-build
          PEER_PYTHON: ${{ steps.python.outputs.python-path }}
          QPERIAPT_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          "$PEER_PYTHON" -I -m venv "$RUNNER_TEMP/reference-wheel-build"
          "$RUNNER_TEMP/reference-wheel-build/bin/python" -I -m pip install \
            --isolated --disable-pip-version-check --index-url https://pypi.org/simple \
            --only-binary=:all: --no-deps --require-hashes \
            -r research/continuity-openssl-peer/build-requirements.txt \
            > target/reference-root-ci/wheel-backend.stdout 2> target/reference-root-ci/wheel-backend.stderr
          "$PEER_PYTHON" -I -m pip install --isolated --disable-pip-version-check \
            --index-url https://pypi.org/simple --only-binary=:all: --no-deps --require-hashes \
            --target "$RUNNER_TEMP/reference-provider" -r research/continuity-openssl-peer/requirements.txt \
            > target/reference-root-ci/provider.stdout 2> target/reference-root-ci/provider.stderr
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export SOURCE_DATE_EPOCH
          "$RUNNER_TEMP/reference-wheel-build/bin/python" -I -m pip wheel \
            --isolated --disable-pip-version-check --no-index --no-deps --no-build-isolation \
            --wheel-dir "$RUNNER_TEMP/reference-wheel" research/continuity-openssl-peer \
            > target/reference-root-ci/wheel-build.stdout 2> target/reference-root-ci/wheel-build.stderr
          sh artifact/python-run.sh artifact/continuity_independent_install.py \
             --wheel "$RUNNER_TEMP/reference-wheel/qperiapt_continuity_reference-0.0.0-py3-none-any.whl" \
             --output "$PWD/target/reference-root-ci/installation" \
             > target/reference-root-ci/installation.stdout 2> target/reference-root-ci/installation.stderr
          installed_reference=$(jq -er '.installed' target/reference-root-ci/installation/RESULT.json)
          cargo build --locked --release --manifest-path research/continuity-openssl-peer/native/Cargo.toml \
             > target/reference-root-ci/root-counterpart-build.stdout 2> target/reference-root-ci/root-counterpart-build.stderr
          for mode in peer-root-revocation peer-root-replacement peer-root-continuation replan-plan replan-decision; do
            sh artifact/python-run.sh research/continuity-openssl-peer/enrollment_session_checks.py \
               --implementation-root "$installed_reference" --provider-root "$RUNNER_TEMP/reference-provider" \
               --native "$CARGO_TARGET_DIR/release/q-periapt-independent-peer-counterpart" --root-successor "$mode" \
               --output "$PWD/target/reference-root-ci/root-successor-$mode" \
               > "target/reference-root-ci/root-successor-$mode.stdout" 2> "target/reference-root-ci/root-successor-$mode.stderr"
          done
          sh artifact/python-run.sh research/continuity-openssl-peer/enrollment_session_checks.py \
             --implementation-root "$installed_reference" --provider-root "$RUNNER_TEMP/reference-provider" \
             --native "$CARGO_TARGET_DIR/release/q-periapt-independent-peer-counterpart" --root-successor-process-restart peer-root-continuation \
             --output "$PWD/target/reference-root-ci/root-successor-process-restart" \
             > target/reference-root-ci/root-successor-process-restart.stdout 2> target/reference-root-ci/root-successor-process-restart.stderr
          later_cut_pids=()
          for phase in bind retire; do
            sh artifact/python-run.sh research/continuity-openssl-peer/enrollment_session_checks.py \
              --implementation-root "$installed_reference" --provider-root "$RUNNER_TEMP/reference-provider" \
              --native "$CARGO_TARGET_DIR/release/q-periapt-independent-peer-counterpart" --root-successor-later-cuts "$phase" \
              --output "$PWD/target/reference-root-ci/later-root-cuts-$phase" \
              > "target/reference-root-ci/later-root-cuts-$phase.stdout" 2> "target/reference-root-ci/later-root-cuts-$phase.stderr" &
            later_cut_pids+=("$!")
          done
          later_cut_status=0
          for later_cut_pid in "${later_cut_pids[@]}"; do
            if ! wait "$later_cut_pid"; then later_cut_status=1; fi
          done
          test "$later_cut_status" -eq 0
          transition_pids=()
          for closure in plan decision; do
            sh artifact/python-run.sh research/continuity-openssl-peer/enrollment_session_checks.py \
              --implementation-root "$installed_reference" --provider-root "$RUNNER_TEMP/reference-provider" \
              --native "$CARGO_TARGET_DIR/release/q-periapt-independent-peer-counterpart" --root-transition-cuts "$closure" \
              --output "$PWD/target/reference-root-ci/root-transition-cuts-$closure" \
              > "target/reference-root-ci/root-transition-cuts-$closure.stdout" 2> "target/reference-root-ci/root-transition-cuts-$closure.stderr" &
            transition_pids+=("$!")
          done
          transition_status=0
          for transition_pid in "${transition_pids[@]}"; do
            if ! wait "$transition_pid"; then transition_status=1; fi
          done
          test "$transition_status" -eq 0
          transition_cancel_pids=()
          for closure in plan decision; do
            sh artifact/python-run.sh research/continuity-openssl-peer/enrollment_session_checks.py \
              --implementation-root "$installed_reference" --provider-root "$RUNNER_TEMP/reference-provider" \
              --native "$CARGO_TARGET_DIR/release/q-periapt-independent-peer-counterpart" --root-transition-cancellation "$closure" \
              --output "$PWD/target/reference-root-ci/root-transition-cancel-$closure" \
              > "target/reference-root-ci/root-transition-cancel-$closure.stdout" 2> "target/reference-root-ci/root-transition-cancel-$closure.stderr" &
            transition_cancel_pids+=("$!")
          done
          transition_cancel_status=0
          for transition_cancel_pid in "${transition_cancel_pids[@]}"; do
            if ! wait "$transition_cancel_pid"; then transition_cancel_status=1; fi
          done
          test "$transition_cancel_status" -eq 0
          git diff --exit-code
      - name: Retain root continuation build and regression results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reference-root-continuation-${{ matrix.os }}
          path: target/reference-root-ci/
          if-no-files-found: error
