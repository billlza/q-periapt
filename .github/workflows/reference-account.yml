name: Continuity reference account

on:
  push:
    paths:
      - .github/workflows/reference-account.yml
      - research/continuity-reference-app/**
      - crates/**
      - research/continuity-identity-candidate/src/**
      - research/continuity-identity-candidate/Cargo.toml
  pull_request:
    paths:
      - .github/workflows/reference-account.yml
      - research/continuity-reference-app/**
      - crates/**
      - research/continuity-identity-candidate/src/**
      - research/continuity-identity-candidate/Cargo.toml
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTFLAGS: "-D warnings"
  CARGO_TERM_COLOR: never
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  account:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
          - os: macos-15
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "26.10.0"
      - name: Prepare native OpenSSL on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - name: Select native OpenSSL on Apple Silicon
        if: runner.os == 'macOS'
        run: |
          openssl_prefix=$(brew --prefix openssl@3)
          echo "OPENSSL_DIR=$openssl_prefix" >> "$GITHUB_ENV"
      - name: Verify the source and supported host
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$(uname -m)" = "$EXPECTED_ARCH"
          mkdir -p target/reference-account-ci
          git rev-parse HEAD > target/reference-account-ci/source-head.txt
          rustc -vV > target/reference-account-ci/rustc.txt
          uname -a > target/reference-account-ci/host.txt
          pkg-config --modversion openssl > target/reference-account-ci/openssl.txt
          node --version > target/reference-account-ci/node.txt
      - name: Verify browser recovery and exact integer transport
        run: |
          for module in research/continuity-reference-app/web/*.mjs; do
            node --check "$module"
          done
          node --input-type=module --check < research/continuity-reference-app/web/app.js
          node --test --test-reporter=tap research/continuity-reference-app/tests/web/*.test.mjs \
            > target/reference-account-ci/web-tests.stdout 2> target/reference-account-ci/web-tests.stderr
      - name: Verify account, enrollment transactions and process recovery
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/reference-account-build
        run: |
          manifest=research/continuity-reference-app/Cargo.toml
          cargo fmt --manifest-path "$manifest" -- --check \
            > target/reference-account-ci/fmt.stdout 2> target/reference-account-ci/fmt.stderr
          cargo test --locked --manifest-path "$manifest" \
            > target/reference-account-ci/tests.stdout 2> target/reference-account-ci/tests.stderr
          cargo clippy --locked --all-targets --manifest-path "$manifest" -- -D warnings \
            > target/reference-account-ci/clippy.stdout 2> target/reference-account-ci/clippy.stderr
          cargo build --locked --release --manifest-path "$manifest" \
            > target/reference-account-ci/build.stdout 2> target/reference-account-ci/build.stderr
          cargo test --locked --release --manifest-path "$manifest" \
            > target/reference-account-ci/release-tests.stdout 2> target/reference-account-ci/release-tests.stderr
          shasum -a 256 "$CARGO_TARGET_DIR/release/q-periapt-continuity-reference-app" \
            > target/reference-account-ci/binary.sha256
          cp research/continuity-reference-app/Cargo.lock target/reference-account-ci/Cargo.lock
          git diff --exit-code
      - name: Retain build and regression results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reference-account-${{ matrix.os }}
          path: target/reference-account-ci/
          if-no-files-found: error
