name: CodeQL integration checks

on:
  push:
    branches: [recover/codeql-production-20261111]

permissions:
  contents: read

concurrency:
  group: codeql-integration-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    name: Verify CodeQL integration contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        id: proof_python
        with:
          python-version: "3.14.7"
          check-latest: false
          update-environment: false
      - name: Record the exact checked-out source
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          git rev-parse HEAD 'HEAD^{tree}' > "$RUNNER_TEMP/codeql-integration-source.txt"
      - name: Check admission, execution, progress and publication contracts
        shell: bash
        env:
          QPERIAPT_PYTHON: ${{ steps.proof_python.outputs.python-path }}
        run: |
          sh artifact/python-run.sh -m unittest -v \
            test_codeql_rust_plan test_codeql_rust_profile \
            test_codeql_rust_publication test_codeql_rust_transfer \
            test_codeql_summary_archive_input test_codeql_summary_plan \
            test_codeql_summary_control test_codeql_summary_projection \
            test_codeql_process_resources test_codeql_progress \
            test_codeql_workflow_contract \
            2>&1 | tee "$RUNNER_TEMP/codeql-integration-tests.log"
      - name: Retain the original test output and source identity
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: codeql-integration-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/codeql-integration-source.txt
            ${{ runner.temp }}/codeql-integration-tests.log
          if-no-files-found: error
          retention-days: 14
