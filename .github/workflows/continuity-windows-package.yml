name: Installed Windows Continuity lifecycle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connect-probe:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.98.1
      - name: Materialize isolated same-source connection probe
        shell: bash
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          import hashlib,json,subprocess
          root=Path.cwd()
          out=root / "target/connect-probe"
          (out/"src").mkdir(parents=True)
          source=root / "research/continuity-identity-candidate/src/connect.rs"
          raw=source.read_text()
          text=raw.split("#[cfg(test)]\nmod tests {")[0]
          for old,new in [
           ("Poll::new()?", 'Poll::new().inspect_err(|e| eprintln!("PROBE_STAGE poll-new: {e:?}"))?'),
           ("mio::net::TcpStream::connect(address)?", 'mio::net::TcpStream::connect(address).inspect_err(|e| eprintln!("PROBE_STAGE connect: {e:?}"))?'),
           (".register(&mut stream, Token(0), Interest::WRITABLE)?", '.register(&mut stream, Token(0), Interest::WRITABLE).inspect_err(|e| eprintln!("PROBE_STAGE register: {e:?}"))?'),
           ("Err(error) => return Err(stream.take_error()?.unwrap_or(error)),", 'Err(error) => { eprintln!("PROBE_STAGE peer-address: {error:?}"); return Err(stream.take_error()?.unwrap_or(error)); },'),
           ("Err(error) => return Err(error),", 'Err(error) => { eprintln!("PROBE_STAGE poll: {error:?}"); return Err(error); },'),
           ("if let Some(error) = stream.take_error()? {", 'if let Some(error) = stream.take_error().inspect_err(|e| eprintln!("PROBE_STAGE take-error-query: {e:?}"))? { eprintln!("PROBE_STAGE take-error-result: {error:?}");'),
           ("poll.registry().deregister(&mut stream)?", 'poll.registry().deregister(&mut stream).inspect_err(|e| eprintln!("PROBE_STAGE deregister: {e:?}"))?'),
           ("stream.set_nonblocking(false)?", 'stream.set_nonblocking(false).inspect_err(|e| eprintln!("PROBE_STAGE blocking: {e:?}"))?'),
          ]:
           if old not in text: raise ValueError(old)
           text=text.replace(old,new)
          (out/"src/connect.rs").write_text(text)
          (out/"src/cancellation.rs").write_bytes((root/"research/continuity-identity-candidate/src/cancellation.rs").read_bytes())
          (out/"Cargo.toml").write_text('[package]\nname="connect-probe"\nversion="0.0.0"\nedition="2021"\n[workspace]\n[dependencies]\nmio={version="=1.2.3",default-features=false,features=["net","os-poll"]}\n')
          (out/"src/main.rs").write_text(r'''use std::{io::{self,Read,Write},net::TcpListener,time::{Duration,Instant}};
          mod cancellation;
          pub use cancellation::Cancellation;
          mod connect;
          fn attempt(address: &str) -> io::Result<()> {
           let listener=TcpListener::bind(address)?;
           let mut client=connect::tcp(listener.local_addr()?,Instant::now()+Duration::from_secs(3),&Cancellation::default())?;
           let (mut server,_)=listener.accept().inspect_err(|e|eprintln!("PROBE_STAGE accept: {e:?}"))?;
           for socket in [&client,&server] {
            socket.set_read_timeout(Some(Duration::from_millis(25)))?;
            socket.set_write_timeout(Some(Duration::from_millis(25)))?;
            socket.set_nodelay(true)?;
           }
           client.write_all(b"c").inspect_err(|e|eprintln!("PROBE_STAGE client-write: {e:?}"))?;
           let mut b=[0];server.read_exact(&mut b).inspect_err(|e|eprintln!("PROBE_STAGE server-read: {e:?}"))?;assert_eq!(b,*b"c");
           server.write_all(b"s").inspect_err(|e|eprintln!("PROBE_STAGE server-write: {e:?}"))?;
           client.read_exact(&mut b).inspect_err(|e|eprintln!("PROBE_STAGE client-read: {e:?}"))?;assert_eq!(b,*b"s");
           Ok(())
          }
          fn main() {
           let mut failures=0;
           for address in ["127.0.0.1:0","[::1]:0"] {
            for i in 0..3000 { if let Err(e)=attempt(address) {eprintln!("PROBE_FAILURE address={address} iteration={i} error={e:?}");failures+=1; if failures==20 {std::process::exit(1);} } }
            println!("PROBE_COMPLETED address={address} attempts=3000 failures={failures}");
           }
           if failures!=0 {std::process::exit(1);}
          }
          ''')
          (out/"SOURCE.json").write_text(json.dumps({"diagnostic_commit":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),"original_source_sha256":hashlib.sha256(source.read_bytes()).hexdigest(),"original_source_commit":"723c1fe5ceefb9c83dce0683c48935742a894d86","instrumentation":"Only diagnostic error prints; same single owned socket, deadlines, cancellation and outcomes."},indent=2))
          PYCODE
      - name: Exercise original connection and blocking transfer
        shell: bash
        run: |
          set -euo pipefail
          cargo run --release --manifest-path target/connect-probe/Cargo.toml 2>&1 | tee target/connect-probe/OUTPUT.log
      - name: Retain original source identity and diagnostic results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: connect-probe-${{ matrix.os }}
          path: |
            target/connect-probe/OUTPUT.log
            target/connect-probe/SOURCE.json
            target/connect-probe/src/*
            target/connect-probe/Cargo.toml
            target/connect-probe/Cargo.lock
          if-no-files-found: error
