name: Installed Windows Continuity lifecycle

on:
  push:
    branches: [lza/windows-private-store]
    # SDK packaging reads the workspace, public fixtures and fuzz audit inputs.
    # Artifact helpers form one maintained boundary, including transitive readers.
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain*
      - .cargo/**
      - .gitattributes
      - .gitignore
      - crates/**
      - ctstats/Cargo.toml
      - models/*/Cargo.toml
      - services/*/Cargo.toml
      - fuzz/Cargo.toml
      - fuzz/Cargo.lock
      - README.md
      - LICENSE*
      - LICENSES/**
      - .github/workflows/continuity-windows-package.yml
      - artifact/**
      - research/continuity-identity-candidate/**
      - bindings/c/ContinuityPackageConsumer/**
      - bindings/rust/SDKPackageConsumer/**
      - bindings/*-vectors.json
  pull_request:
    branches: [lza/windows-private-store]
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain*
      - .cargo/**
      - .gitattributes
      - .gitignore
      - crates/**
      - ctstats/Cargo.toml
      - models/*/Cargo.toml
      - services/*/Cargo.toml
      - fuzz/Cargo.toml
      - fuzz/Cargo.lock
      - README.md
      - LICENSE*
      - LICENSES/**
      - .github/workflows/continuity-windows-package.yml
      - artifact/**
      - research/continuity-identity-candidate/**
      - bindings/c/ContinuityPackageConsumer/**
      - bindings/rust/SDKPackageConsumer/**
      - bindings/*-vectors.json

permissions:
  contents: read
  actions: read

jobs:
  sdk-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.98.1
          components: clippy
      - name: Install the scoped audit tool
        run: cargo +1.98.1 install cargo-audit --version 0.22.2 --locked --root "$RUNNER_TEMP/sdk-package-tools"
      - name: Produce and verify SDK archives from this checkout
        run: |
          PATH="$RUNNER_TEMP/sdk-package-tools/bin:$PATH"
          export PATH
          sh artifact/rust-publish-contract.sh --profile sdk-020 --output target/sdk-rust-package
      - name: Preserve SDK archives and producer evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-sdk-package
          path: |
            target/sdk-rust-package/crates/*.crate
            target/sdk-rust-package/*.json
            target/sdk-rust-package/*.stdout
            target/sdk-rust-package/*.stderr
            target/sdk-rust-package/consumer-Cargo.lock
          if-no-files-found: error

  prepare:
    needs: sdk-package
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.98.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        id: python
        with:
          python-version: "3.14.7"
          check-latest: false
          update-environment: false
      # The completed same-run producer owns the exact SDK source identity.
      # Archive hashes and source members still have to match this checkout.
      - name: Check public C export and substitution refusals
        env:
          QPERIAPT_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          set -euo pipefail
          sh artifact/python-run.sh -m unittest discover -s artifact -p 'test_continuity_windows_*.py'
          sh artifact/python-run.sh artifact/test_continuity_fetch.py
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: windows-sdk-package
          path: target/windows-sdk-input
      - name: Package candidate against admitted SDK archives
        env:
          QPERIAPT_PYTHON: ${{ steps.python.outputs.python-path }}
          EXPECTED_SDK_COMMIT: ${{ github.sha }}
        run: |
          sh artifact/python-run.sh artifact/continuity_windows_prepare.py \
            --report target/windows-sdk-input/RUST_SDK_PACKAGE.json \
            --sdk-commit "$EXPECTED_SDK_COMMIT" \
            --output target/windows-installed-input
      - name: Preserve archive closure and producer results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-installed-input
          path: target/windows-installed-input/
          if-no-files-found: error

  native:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        profile: [debug, release]
    runs-on: ${{ matrix.os }}
    # Each job executes one complete profile, including the six real-expiry
    # registration routes. Public readback requires both profiles from the same
    # producer input. Individual command and protocol deadlines stay unchanged.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.98.1
          components: clippy
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        id: native_python
        with:
          python-version: "3.14.7"
          check-latest: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: windows-installed-input
          path: target/windows-installed-input
      - name: Check native public C reader import and contracts
        shell: bash
        env:
          WINDOWS_PYTHON: ${{ steps.native_python.outputs.python-path }}
        run: |
          QPERIAPT_PYTHON="$(cygpath -u "$WINDOWS_PYTHON")"
          export QPERIAPT_PYTHON
          sh artifact/python-run.sh -m unittest discover -s artifact -p 'test_continuity_windows_*.py'
      - name: Select native MSVC environment and owned private test root
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $installation) { throw 'MSVC installation unavailable' }
          $vcvars = Join-Path $installation 'VC/Auxiliary/Build/vcvars64.bat'
          $lines = & $env:ComSpec /d /s /c "`"$vcvars`" >nul && set"
          if ($LASTEXITCODE -ne 0) { throw 'MSVC environment failed' }
          $selected = @('PATH', 'INCLUDE', 'LIB', 'LIBPATH', 'VCToolsInstallDir', 'WindowsSdkDir', 'WindowsSDKVersion', 'VCINSTALLDIR', 'VSINSTALLDIR', 'VSCMD_ARG_HOST_ARCH', 'VSCMD_ARG_TGT_ARCH')
          foreach ($line in $lines) {
            if ($line -match '^([^=]+)=(.*)$' -and $Matches[1] -in $selected) { "$($Matches[1])=$($Matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append }
          }
          $env:QPC_FIRST_USE_ROOT = Join-Path $env:RUNNER_TEMP 'installed-c-private'
          New-Item -ItemType Directory -Path $env:QPC_FIRST_USE_ROOT | Out-Null
          $privateRoot = @'
          $ErrorActionPreference = 'Stop'
          $sid = [System.Security.Principal.WindowsIdentity]::GetCurrent().User
          $acl = New-Object System.Security.AccessControl.DirectorySecurity
          $acl.SetOwner($sid)
          $acl.SetAccessRuleProtection($true, $false)
          $inherit = [System.Security.AccessControl.InheritanceFlags]'ContainerInherit, ObjectInherit'
          $allow = [System.Security.AccessControl.AccessControlType]::Allow
          $none = [System.Security.AccessControl.PropagationFlags]::None
          $acl.AddAccessRule((New-Object System.Security.AccessControl.FileSystemAccessRule($sid, 'FullControl', $inherit, $none, $allow)))
          [System.IO.Directory]::SetAccessControl($env:QPC_FIRST_USE_ROOT, $acl)
          '@
          & "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe" -NoLogo -NoProfile -NonInteractive -Command $privateRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Execute installed C and Rust lifecycle
        shell: bash
        env:
          WINDOWS_PYTHON: ${{ steps.native_python.outputs.python-path }}
        run: |
          # Git Bash prepends its Unix utilities, including an unrelated link.exe.
          # Restore the selected native compiler directory ahead of those tools.
          msvc_root="$(cygpath -u "$VCToolsInstallDir")"
          msvc_bin="${msvc_root%/}/bin/Hostx64/x64"
          test -x "$msvc_bin/link.exe"
          PATH="$msvc_bin:$PATH"
          export PATH
          test "$(command -v link.exe)" = "$msvc_bin/link.exe"
          QPERIAPT_PYTHON="$(cygpath -u "$WINDOWS_PYTHON")"
          export QPERIAPT_PYTHON
          sh artifact/python-run.sh artifact/continuity_windows_consume.py --input target/windows-installed-input/INPUT.json --output target/windows-installed-results --private-root "$RUNNER_TEMP/installed-c-private" --profile "${{ matrix.profile }}"
      - name: Preserve public results and exact C library inputs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-installed-c-${{ matrix.os }}-${{ matrix.profile }}
          path: target/windows-installed-results/
          if-no-files-found: error

  public-readback:
    needs: native
    if: ${{ always() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        id: python
        with:
          python-version: "3.14.7"
          check-latest: false
          update-environment: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: windows-installed-c-${{ matrix.os }}-debug
          path: target/windows-public-readback/debug
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: windows-installed-c-${{ matrix.os }}-release
          path: target/windows-public-readback/release
      - name: Verify original Rust and C public lifecycle contracts
        env:
          QPERIAPT_PYTHON: ${{ steps.python.outputs.python-path }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          sh artifact/python-run.sh artifact/continuity_windows_network_review.py --profile-inputs target/windows-public-readback/debug target/windows-public-readback/release --output target/windows-public-readback/NETWORK_REVIEW.json --head "$EXPECTED_HEAD"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-lifecycle-readback-${{ matrix.os }}
          path: target/windows-public-readback/NETWORK_REVIEW.json
          if-no-files-found: error
