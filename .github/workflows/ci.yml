        run: |
          report=target/continuity-sdk-input/sdk-rust-package/RUST_SDK_PACKAGE.json
          report_sha256=$(sha256sum "$report" | cut -d' ' -f1)
          sh artifact/python-run.sh artifact/continuity_package.py \
            --report "$report" --report-sha256 "$report_sha256" \
            --toolchain-root "$(rustc +1.98.1 --print sysroot)" \
            --with-c-consumer --witness-openssl-prefix /usr \
            --output target/continuity-installed-rust
      - name: Retain package and public execution evidence without private test state
        if: always()
