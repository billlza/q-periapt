  continuity-installed-swift:
    name: continuity-installed-${{ matrix.consumer }}
    needs: rust-publish-contract
    runs-on: macos-15
    # Keep every Rust/C prerequisite and both Kotlin profiles/GC variants.
    # At 491b6cde, Kotlin execution took 178m35s and artifact upload 84s;
    # job 112452386048 exceeded 180m during finalization after both succeeded.
    # Allow 30m job headroom; individual command deadlines stay fixed.
    timeout-minutes: ${{ matrix.consumer == 'kotlin' && 210 || 120 }}
    strategy:
      fail-fast: false
      matrix:
        consumer: [swift, kotlin]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.98.1
          components: clippy
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        id: continuity_python
        with:
          python-version: "3.14.7"
          check-latest: false
          update-environment: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: rust-sdk-package
          path: target/continuity-sdk-input
      - name: Set up Java 25 for installed Continuity consumers
        if: matrix.consumer == 'kotlin'
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        if: matrix.consumer == 'kotlin'
        with:
          gradle-version: "9.8.0"
          cache-disabled: true
      - name: Execute installed ${{ matrix.consumer }} owners against native Rust peers
        env:
          QPERIAPT_PYTHON: ${{ steps.continuity_python.outputs.python-path }}
          CONTINUITY_CONSUMER: ${{ matrix.consumer }}
        run: |
          report=target/continuity-sdk-input/sdk-rust-package/RUST_SDK_PACKAGE.json
          report_sha256=$(shasum -a 256 "$report" | cut -d' ' -f1)
          case "$CONTINUITY_CONSUMER" in
            swift)
              consumer_args=(--with-swift-consumer)
              ;;
            kotlin)
              gradle_home=$(sh artifact/python-run.sh -c 'from pathlib import Path; import sys; print(Path(sys.argv[1]).resolve(strict=True).parent.parent)' "$(command -v gradle)")
              consumer_args=(--with-kotlin-consumer --kotlin-java-home "$JAVA_HOME" --kotlin-gradle-home "$gradle_home")
              ;;
            *)
              echo "Unsupported Continuity consumer: $CONTINUITY_CONSUMER" >&2
              exit 1
              ;;
          esac
          sh artifact/python-run.sh artifact/continuity_package.py \
            --report "$report" --report-sha256 "$report_sha256" \
            --toolchain-root "$(rustc +1.98.1 --print sysroot)" \
            --with-c-consumer "${consumer_args[@]}" \
            --witness-openssl-prefix "$(brew --prefix openssl@3)" \
            --output target/continuity-installed-swift
      - name: Retain native packages and selected public execution evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: continuity-installed-${{ matrix.consumer }}
          path: |
            target/continuity-installed-swift/*.crate
            target/continuity-installed-swift/*.zip
            target/continuity-installed-swift/*.json
            target/continuity-installed-swift/*.stdout
            target/continuity-installed-swift/*.stderr
            target/continuity-installed-swift/*.events
            target/continuity-installed-swift/debug-roster-renewal-public/**
            target/continuity-installed-swift/release-roster-renewal-public/**
            target/continuity-installed-swift/debug-device-replacement-public/**
            target/continuity-installed-swift/release-device-replacement-public/**
            target/continuity-installed-swift/debug-device-retirement-public/**
            target/continuity-installed-swift/release-device-retirement-public/**
            target/continuity-installed-swift/debug-enrollment-public/**
            target/continuity-installed-swift/release-enrollment-public/**
            target/continuity-installed-swift/debug-enrollment-reopen-public/**
            target/continuity-installed-swift/release-enrollment-reopen-public/**
            target/continuity-installed-swift/c-enrollment-public/**
