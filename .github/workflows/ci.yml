  # Actual-signature Continuity candidate, isolated from the SDK publication graph.
  continuity-identity-candidate:
    runs-on: ${{ matrix.os }}
    # At e00281e the canonical Linux Debug suite took 2,059.56 s for 281 tests;
    # both MSRV jobs and one canonical job reached the 40-minute deadline.
    # Budget the complete Debug/Release, compiler, SDK and documentation checks.
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/continuity-identity-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            toolchain: 1.98.1
          - os: ubuntu-24.04
            toolchain: 1.90.0
          - os: macos-15
            toolchain: 1.98.1
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        if: matrix.toolchain == '1.98.1'
        with:
          toolchain: 1.98.1
          components: clippy,rustfmt
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        if: matrix.toolchain == '1.90.0'
        with:
          toolchain: 1.90.0
          components: clippy,rustfmt
      - name: Require Apple Silicon for macOS Continuity
        if: matrix.os == 'macos-15'
        run: test "$(uname -m)" = arm64
      - name: Check and exercise candidate with the selected compiler
        env:
          CANDIDATE_TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          candidate_manifest=research/continuity-identity-candidate/Cargo.toml
          cargo +"$CANDIDATE_TOOLCHAIN" check --manifest-path "$candidate_manifest" --all-targets --locked --no-default-features
          cargo +"$CANDIDATE_TOOLCHAIN" clippy --manifest-path "$candidate_manifest" --all-targets --all-features --locked -- -D warnings
          for candidate_feature in control-tls connection-tls; do
            cargo +"$CANDIDATE_TOOLCHAIN" clippy --manifest-path "$candidate_manifest" --all-targets --no-default-features --features "$candidate_feature" --locked -- -D warnings
          done
          cargo +"$CANDIDATE_TOOLCHAIN" test --manifest-path "$candidate_manifest" --all-features --locked -- --nocapture
          cargo +"$CANDIDATE_TOOLCHAIN" test --manifest-path "$candidate_manifest" --all-features --locked --release -- --nocapture
      - name: Verify sealed SDK operations with the selected compiler
        env:
          CANDIDATE_TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          cargo +"$CANDIDATE_TOOLCHAIN" clippy --locked -p q-periapt-sdk --features sealed-operations --all-targets -- -D warnings
          cargo +"$CANDIDATE_TOOLCHAIN" test --locked -p q-periapt-sdk --features sealed-operations
          cargo +"$CANDIDATE_TOOLCHAIN" test --locked --release -p q-periapt-sdk --features sealed-operations
      - name: Check canonical formatting and documentation
        if: matrix.toolchain == '1.98.1'
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo +1.98.1 fmt --manifest-path research/continuity-identity-candidate/Cargo.toml --package q-periapt-continuity-identity-candidate -- --check
          cargo +1.98.1 doc --manifest-path research/continuity-identity-candidate/Cargo.toml --all-features --locked --no-deps
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        if: matrix.os == 'macos-15'
        id: candidate_python
        with:
          python-version: "3.14.7"
          check-latest: false
          update-environment: false
      - name: Verify public bytes and both signatures independently
        if: matrix.os == 'macos-15'
        env:
          QPERIAPT_PYTHON: ${{ steps.candidate_python.outputs.python-path }}
        run: |
          mkdir -p target
          candidate_openssl="$(brew --prefix openssl@3)/bin/openssl"
          test -x "$candidate_openssl"
          cargo +1.98.1 build --manifest-path research/continuity-identity-candidate/Cargo.toml --locked --all-features --example contract_report
          sh artifact/python-run.sh artifact/continuity_contract.py \
            --consumer "$CARGO_TARGET_DIR/debug/examples/contract_report" \
            --output target/continuity-wire-contract
          cargo +1.98.1 run --manifest-path research/continuity-identity-candidate/Cargo.toml --locked --example public_vectors -- target/continuity-public-vectors --with-anchor --with-rekey
          sh artifact/python-run.sh research/continuity-identity-candidate/scripts/verify_public_vectors.py \
            --fixtures target/continuity-public-vectors --output target/continuity-public-verification \
            --openssl "$candidate_openssl" --with-rekey
          sh artifact/python-run.sh research/continuity-identity-candidate/scripts/verify_anchor_vectors.py \
            --fixtures target/continuity-public-vectors --output target/continuity-anchor-verification \
            --openssl "$candidate_openssl"
          cargo +1.98.1 build --manifest-path research/continuity-identity-candidate/Cargo.toml --locked --release --all-features --example import_bootstrap_bundle
          sh artifact/python-run.sh research/continuity-identity-candidate/scripts/exercise_bootstrap_bundle.py \
            --fixtures target/continuity-public-vectors --consumer "$CARGO_TARGET_DIR/release/examples/import_bootstrap_bundle" \
            --output target/continuity-bootstrap-bundle-verification
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && matrix.os == 'macos-15'
        with:
          name: continuity-public-vectors-${{ github.sha }}
          path: |
            target/continuity-public-vectors
            target/continuity-public-verification
            target/continuity-anchor-verification
            target/continuity-bootstrap-bundle-verification
            target/continuity-wire-contract
          if-no-files-found: error
          retention-days: 14

  # Cross-target feature fence for the shipping WASM face and dependency-free core.
  feature-fence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # canonical 1.98.1
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown,thumbv7em-none-eabihf
      - name: Install and verify the pinned WebAssembly C compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18
          test -x /usr/bin/clang-18
          /usr/bin/clang-18 --version
          /usr/bin/clang-18 --print-targets | grep -Eq '^[[:space:]]*wasm32[[:space:]]+-'
          echo 'CC_wasm32_unknown_unknown=/usr/bin/clang-18' >> "$GITHUB_ENV"
      - run: cargo build --locked -p q-periapt-wasm --target wasm32-unknown-unknown
      - run: cargo build --locked -p q-periapt-core --target thumbv7em-none-eabihf

  # Formal proofs. The no-admits check is a reliable HARD GATE (catches a proof
  # being stubbed out). The full EasyCrypt machine-check runs in the pinned-source
  # hard-gate job below. The binding theorem reduces only to be8 fixed-width /
  # injectivity + CR(H); see formal/.
  formal-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          persist-credentials: false
      - name: No admits/sorry in the mechanized proofs (hard gate)
        run: "! grep -rnEw 'admit|sorry' --include='*.ec' formal/easycrypt/"
      # The FULL proof re-check (BindingViaCR.ec + seven proof-dependency regression controls
      # + the non-normative Lifecycle/Prekey canonical-projection diagnostics) runs as a HARD
      # GATE in `formal-easycrypt` below. Hint-deletion failures establish only dependencies of
      # the current scripts; semantic necessity comes from explicit countermodels.

  # Pinned-source EasyCrypt proof check (HARD GATE). The base image digest and EasyCrypt commit
  # are immutable; apt/opam transitive inputs are not a bit-reproducible or hermetic closure.
  # Re-runs the binding proof, proof-dependency controls, and both Continuity diagnostics.
  # `BindingViaCR.ec` also contains the explicit probability-one K!=bottom countermodel; do not
  # infer logical necessity merely from an edited tactic failing.
  formal-easycrypt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          persist-credentials: false
      - name: Verify binding proof assumptions and statements
        run: sh artifact/python-run.sh artifact/easycrypt_binding_contract.py
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build the pinned EasyCrypt image (layer-cached)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: formal/Dockerfile
          tags: q-periapt-ec:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Machine-check proof, countermodels, and dependency controls (HARD GATE)
        run: |
          # Mount the proofs read-only and copy into a container-owned dir: the checkout's committed
          # .eco is host-owned, so the container's opam user can't rm it in place. Copying makes the
          # files opam-owned, so `rm -f *.eco` forces a from-scratch re-check.
          docker run --rm \
            -v "${{ github.workspace }}/artifact:/work/artifact:ro" \
            -v "${{ github.workspace }}/formal/easycrypt:/src:ro" \
            q-periapt-ec:ci opam exec -- sh -c \
            'sh artifact/python-run.sh artifact/formal_toolchain_contract.py verify-installed --tool easycrypt &&
             mkdir -p /tmp/ec && cp -r /src/. /tmp/ec && cd /tmp/ec &&
             rm -f *.eco continuity/*.eco &&
             MAKEFLAGS="" GNUMAKEFLAGS="" MAKEFILES="" make EC=easycrypt check &&
             EASYCRYPT=easycrypt sh negative-controls.sh &&
             MAKEFLAGS="" GNUMAKEFLAGS="" MAKEFILES="" \
               make -C continuity EC=easycrypt check'

  # Symbolic handshake proof. The lemma-presence check catches a lemma being
  # deleted/stubbed out; the full Tamarin machine-check is a HARD GATE too.
  # Proves authentication + hybrid secrecy of the PQ/T handshake in the symbolic
  # (Dolev–Yao) model; see formal/tamarin.
  tamarin-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          persist-credentials: false
      - name: Handshake and migration lemma names present (hard gate)
        run: MAKEFLAGS='' GNUMAKEFLAGS='' MAKEFILES='' make -C formal/tamarin check-lemma-names
      - name: Install Maude + Tamarin
        run: |
          set -euo pipefail

          cleanup_formal_tool_asset() {
            asset_path=$1
            expected_leaf=$2
            test -n "$asset_path" || return 0
            asset_parent=${asset_path%/*}
            case "$asset_parent" in
              /tmp/qperiapt-formal-tool-asset.?*) ;;
              *)
                printf 'error: refusing to clean unexpected formal-tool asset path: %s\n' \
                  "$asset_path" >&2
                return 1
                ;;
            esac
            case "${asset_parent#/tmp/}" in
              */*)
                printf 'error: refusing nested formal-tool asset path: %s\n' \
                  "$asset_path" >&2
                return 1
                ;;
            esac
            asset_suffix=${asset_parent#/tmp/qperiapt-formal-tool-asset.}
            case "$asset_suffix" in
              "" | *[!0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz._-]*)
                printf 'error: refusing malformed formal-tool asset path: %s\n' \
                  "$asset_path" >&2
                return 1
                ;;
            esac
            if [ "${#asset_suffix}" -gt 64 ]; then
              printf 'error: refusing oversized formal-tool asset path: %s\n' \
                "$asset_path" >&2
              return 1
            fi
            if [ -L "$asset_parent" ] || [ ! -d "$asset_parent" ]; then
              printf 'error: refusing invalid formal-tool asset directory: %s\n' \
                "$asset_parent" >&2
              return 1
            fi
            if [ "${asset_path##*/}" != "$expected_leaf" ] || \
              [ -L "$asset_path" ] || [ ! -f "$asset_path" ]; then
              printf 'error: refusing to clean invalid formal-tool asset: %s\n' \
                "$asset_path" >&2
              return 1
            fi
            rm -- "$asset_path"
            rmdir -- "$asset_parent"
          }
          MAUDE_ARCHIVE=
          TAMARIN_ARCHIVE=
          cleanup_formal_tool_assets() {
            cleanup_status=0
            if [ -n "$TAMARIN_ARCHIVE" ]; then
              cleanup_formal_tool_asset \
                "$TAMARIN_ARCHIVE" \
                tamarin-prover-1.12.0-linux64-ubuntu.tar.gz || cleanup_status=$?
            fi
            if [ -n "$MAUDE_ARCHIVE" ]; then
              cleanup_formal_tool_asset \
                "$MAUDE_ARCHIVE" \
                Maude-3.5.1-linux-x86_64.zip || cleanup_status=$?
            fi
            return "$cleanup_status"
          }
          trap cleanup_formal_tool_assets EXIT

          sudo apt-get update
          sudo apt-get install -y graphviz unzip

          MAUDE_ARCHIVE=$(sh artifact/python-run.sh artifact/formal_tool_asset.py --asset maude-3.5.1)
          sudo mkdir -p /opt/maude-3.5.1
          sudo unzip -q "$MAUDE_ARCHIVE" -d /opt/maude-3.5.1
          sudo chmod 0755 /opt/maude-3.5.1/maude
          printf '%s\n' /opt/maude-3.5.1 >> "$GITHUB_PATH"
          export PATH="/opt/maude-3.5.1:$PATH"
          cleanup_formal_tool_asset "$MAUDE_ARCHIVE" Maude-3.5.1-linux-x86_64.zip
          MAUDE_ARCHIVE=

          TAMARIN_ARCHIVE=$(sh artifact/python-run.sh artifact/formal_tool_asset.py --asset tamarin-1.12.0)
          TAMARIN_DIR=$(mktemp -d)
          tar -xzf "$TAMARIN_ARCHIVE" -C "$TAMARIN_DIR" tamarin-prover
          sudo install -m 0755 \
            "$TAMARIN_DIR/tamarin-prover" \
            /usr/local/bin/tamarin-prover
          cleanup_formal_tool_asset \
            "$TAMARIN_ARCHIVE" \
            tamarin-prover-1.12.0-linux64-ubuntu.tar.gz
          TAMARIN_ARCHIVE=
          rm -rf "$TAMARIN_DIR"
          trap - EXIT
      - name: Verify pinned Tamarin and Maude identities
        run: sh artifact/python-run.sh artifact/formal_toolchain_contract.py verify-installed --tool tamarin
      - name: Machine-check handshake, migration, and countermodels (make prove)
        run: |
          MAKEFLAGS='' GNUMAKEFLAGS='' MAKEFILES='' \
            make -C formal/tamarin TAMARIN=tamarin-prover \
              DERIVCHECK_TIMEOUT=60 prove

  # Second, independent symbolic prover (ProVerif) for the same handshake — assurance
  # diversity. The security events + queries are presence-gated, and the ProVerif
  # machine-check is also a HARD GATE: `make prove` asserts the RESULT lines. See
  # formal/proverif.
  proverif-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          persist-credentials: false
      - name: Handshake events + six queries present (hard gate)
        run: |
          for e in ServerDone ClientFinish RevealSig RevealPQ RevealTrad; do
            grep -qE "^event ${e}\(" formal/proverif/handshake.pv || { echo "missing event: ${e}"; exit 1; }
          done
          n=$(grep -cE '^query ' formal/proverif/handshake.pv)
          test "$n" -eq 6 || { echo "expected exactly 6 queries, found $n"; exit 1; }
      - name: Install ProVerif
        run: |
          set -euo pipefail

          OPAM_BIN=
          cleanup_opam_asset() {
            test -n "$OPAM_BIN" || return 0
            opam_parent=${OPAM_BIN%/*}
            case "$opam_parent" in
              /tmp/qperiapt-formal-tool-asset.?*) ;;
              *)
                printf 'error: refusing to clean unexpected opam asset path: %s\n' \
                  "$OPAM_BIN" >&2
                return 1
                ;;
            esac
            case "${opam_parent#/tmp/}" in
              */*)
                printf 'error: refusing nested opam asset path: %s\n' \
                  "$OPAM_BIN" >&2
                return 1
                ;;
            esac
            opam_suffix=${opam_parent#/tmp/qperiapt-formal-tool-asset.}
            case "$opam_suffix" in
              "" | *[!0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz._-]*)
                printf 'error: refusing malformed opam asset path: %s\n' \
                  "$OPAM_BIN" >&2
                return 1
                ;;
            esac
            if [ "${#opam_suffix}" -gt 64 ]; then
              printf 'error: refusing oversized opam asset path: %s\n' \
                "$OPAM_BIN" >&2
              return 1
            fi
            if [ -L "$opam_parent" ] || [ ! -d "$opam_parent" ]; then
              printf 'error: refusing invalid opam asset directory: %s\n' \
                "$opam_parent" >&2
              return 1
            fi
            if [ "${OPAM_BIN##*/}" != opam-2.5.2-x86_64-linux ] || \
              [ -L "$OPAM_BIN" ] || [ ! -f "$OPAM_BIN" ]; then
              printf 'error: refusing to clean invalid opam asset: %s\n' \
                "$OPAM_BIN" >&2
              return 1
            fi
            rm -- "$OPAM_BIN"
            rmdir -- "$opam_parent"
          }
          trap cleanup_opam_asset EXIT

          sudo apt-get update
          sudo apt-get install -y libgtk2.0-dev ocaml pkg-config
          OPAM_BIN=$(sh artifact/python-run.sh artifact/formal_tool_asset.py --asset opam-2.5.2)
          sudo install -m 0755 "$OPAM_BIN" /usr/local/bin/opam
          cleanup_opam_asset
          OPAM_BIN=
          test "$(opam --version)" = "2.5.2"
          opam init -y --disable-sandboxing --no-setup
          opam install -y proverif.2.05
          trap - EXIT
      - name: Verify pinned ProVerif identity
        run: opam exec -- sh artifact/python-run.sh artifact/formal_toolchain_contract.py verify-installed --tool proverif
      - name: Machine-check the handshake model (queries must hold)
        run: |
          MAKEFLAGS='' GNUMAKEFLAGS='' MAKEFILES='' \
            opam exec -- make -C formal/proverif PROVERIF=proverif prove

  # Still TODO as harnesses land (see ctstats/README.md):
  #   - extend the `constant-time` Memcheck/TIMECOP gate to the remaining primitive/backend
  #     paths and to riscv64/wasm32; ML-KEM decapsulation is already gated on x86_64+aarch64
  #   - promote the local dudect timing diagnostic to a gate on quiesced hardware
  # Done since this note was written: full NIST ACVP (ML-KEM-512/768/1024 +
  # ML-DSA-44/65/87 + SLH-DSA) and ContextBound reference vectors in q-periapt-backends;
  # cargo-fuzz targets under fuzz/ (combine + ML-KEM decapsulate) with a seed corpus.
