name: Independent Continuity interoperability

on:
  push:
    paths:
      - .github/workflows/independent-continuity.yml
      - research/continuity-openssl-peer/**
      - research/continuity-identity-candidate/src/**
      - research/continuity-identity-candidate/Cargo.lock
      - crates/q-periapt-core/**
      - crates/q-periapt-backends/**
      - crates/q-periapt-sdk/**
      - crates/q-periapt-policy/**
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTFLAGS: "-D warnings"
  CARGO_TERM_COLOR: never
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  bootstrap:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
          - os: macos-15
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Verify source and native architecture
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$(uname -m)" = "$EXPECTED_ARCH"
          mkdir -p target/independent-peer-ci
          git rev-parse HEAD > target/independent-peer-ci/source-head.txt
          uname -a > target/independent-peer-ci/host.txt
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        id: python
        with:
          python-version: "3.14.7"
          check-latest: false
          update-environment: false
      - name: Install the exact independent provider into an isolated directory
        env:
          PEER_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          "$PEER_PYTHON" -I -m pip --isolated install --disable-pip-version-check \
            --index-url https://pypi.org/simple --only-binary=:all: --no-deps --require-hashes \
            --target "$RUNNER_TEMP/independent-peer-provider" \
            -r research/continuity-openssl-peer/requirements.txt \
            > target/independent-peer-ci/provider.stdout 2> target/independent-peer-ci/provider.stderr
      - name: Build and lint the real Rust counterpart
        run: |
          export CARGO_TARGET_DIR="$RUNNER_TEMP/independent-peer-native"
          manifest=research/continuity-openssl-peer/native/Cargo.toml
          cargo fmt --manifest-path "$manifest" -- --check
          cargo clippy --release --locked --manifest-path "$manifest" -- -D warnings \
            > target/independent-peer-ci/clippy.stdout 2> target/independent-peer-ci/clippy.stderr
          cargo build --release --locked --manifest-path "$manifest" \
            > target/independent-peer-ci/build.stdout 2> target/independent-peer-ci/build.stderr
          cargo metadata --locked --format-version 1 --manifest-path "$manifest" \
            > target/independent-peer-ci/metadata.json
          rustc -vV > target/independent-peer-ci/rustc.txt
          cp "$CARGO_TARGET_DIR/release/q-periapt-independent-peer-counterpart" target/independent-peer-ci/counterpart
          importer_manifest=research/continuity-identity-candidate/Cargo.toml
          cargo clippy --release --locked --manifest-path "$importer_manifest" --example import_bootstrap_bundle -- -D warnings \
            > target/independent-peer-ci/importer-clippy.stdout 2> target/independent-peer-ci/importer-clippy.stderr
          cargo build --release --locked --manifest-path "$importer_manifest" --example import_bootstrap_bundle \
            > target/independent-peer-ci/importer-build.stdout 2> target/independent-peer-ci/importer-build.stderr
          cp "$CARGO_TARGET_DIR/release/examples/import_bootstrap_bundle" target/independent-peer-ci/importer
      - name: Exchange real flights and exercise rejection and replay boundaries
        env:
          QPERIAPT_PYTHON: ${{ steps.python.outputs.python-path }}
          TMPDIR: ${{ runner.temp }}
        run: |
          sh artifact/python-run.sh research/continuity-openssl-peer/run.py \
            --provider-root "$RUNNER_TEMP/independent-peer-provider" \
            --native target/independent-peer-ci/counterpart \
            --output target/independent-peer-ci/exchange \
            > target/independent-peer-ci/exchange.stdout 2> target/independent-peer-ci/exchange.stderr
          git diff --exit-code
      - name: Verify independent four-flight rekey computations and epoch traffic
        env:
          QPERIAPT_PYTHON: ${{ steps.python.outputs.python-path }}
          TMPDIR: ${{ runner.temp }}
        run: |
          sh artifact/python-run.sh research/continuity-openssl-peer/rekey_checks.py \
            --provider-root "$RUNNER_TEMP/independent-peer-provider" \
            --native target/independent-peer-ci/counterpart \
            --output target/independent-peer-ci/rekey \
            > target/independent-peer-ci/rekey.stdout 2> target/independent-peer-ci/rekey.stderr
          git diff --exit-code
      - name: Exercise independent storage cuts and persisted session recovery
        env:
          QPERIAPT_PYTHON: ${{ steps.python.outputs.python-path }}
          TMPDIR: ${{ runner.temp }}
        run: |
          sh artifact/python-run.sh research/continuity-openssl-peer/storage_checks.py \
            --provider-root "$RUNNER_TEMP/independent-peer-provider" \
            --output target/independent-peer-ci/storage-cuts \
            > target/independent-peer-ci/storage-cuts.stdout 2> target/independent-peer-ci/storage-cuts.stderr
          sh artifact/python-run.sh research/continuity-openssl-peer/durability_checks.py \
            --provider-root "$RUNNER_TEMP/independent-peer-provider" \
            --native target/independent-peer-ci/counterpart \
            --output target/independent-peer-ci/session-recovery \
            > target/independent-peer-ci/session-recovery.stdout 2> target/independent-peer-ci/session-recovery.stderr
          git diff --exit-code
      - name: Verify durable rekey recovery, format upgrade and capacity admission
        env:
          QPERIAPT_PYTHON: ${{ steps.python.outputs.python-path }}
          TMPDIR: ${{ runner.temp }}
        run: |
          sh artifact/python-run.sh research/continuity-openssl-peer/durable_rekey_checks.py \
            --provider-root "$RUNNER_TEMP/independent-peer-provider" \
            --native target/independent-peer-ci/counterpart \
            --output target/independent-peer-ci/durable-rekey \
            > target/independent-peer-ci/durable-rekey.stdout 2> target/independent-peer-ci/durable-rekey.stderr
          sh artifact/python-run.sh research/continuity-openssl-peer/capacity_checks.py \
            --provider-root "$RUNNER_TEMP/independent-peer-provider" \
            --native target/independent-peer-ci/counterpart \
            --output target/independent-peer-ci/capacity \
            > target/independent-peer-ci/capacity.stdout 2> target/independent-peer-ci/capacity.stderr
          git diff --exit-code
      - name: Verify independent control-only progress and original-target retries
        env:
          QPERIAPT_PYTHON: ${{ steps.python.outputs.python-path }}
          TMPDIR: ${{ runner.temp }}
        run: |
          sh artifact/python-run.sh research/continuity-openssl-peer/control_checks.py \
            --provider-root "$RUNNER_TEMP/independent-peer-provider" \
            --native target/independent-peer-ci/counterpart \
            --output target/independent-peer-ci/control \
            > target/independent-peer-ci/control.stdout 2> target/independent-peer-ci/control.stderr
          git diff --exit-code
      - name: Verify explicit outcome accounting, report bounds and old-chain disclosure
        env:
          QPERIAPT_PYTHON: ${{ steps.python.outputs.python-path }}
          TMPDIR: ${{ runner.temp }}
        run: |
          sh artifact/python-run.sh research/continuity-openssl-peer/resolution_checks.py \
            --provider-root "$RUNNER_TEMP/independent-peer-provider" \
            --native target/independent-peer-ci/counterpart \
            --output target/independent-peer-ci/resolution \
            > target/independent-peer-ci/resolution.stdout 2> target/independent-peer-ci/resolution.stderr
          sh artifact/python-run.sh research/continuity-openssl-peer/resolution_capacity_checks.py \
            --provider-root "$RUNNER_TEMP/independent-peer-provider" \
            --native target/independent-peer-ci/counterpart \
            --output target/independent-peer-ci/resolution-capacity \
            > target/independent-peer-ci/resolution-capacity.stdout 2> target/independent-peer-ci/resolution-capacity.stderr
          sh artifact/python-run.sh research/continuity-openssl-peer/resolution_disclosure_checks.py \
            --provider-root "$RUNNER_TEMP/independent-peer-provider" \
            --native target/independent-peer-ci/counterpart \
            --output target/independent-peer-ci/resolution-disclosure \
            > target/independent-peer-ci/resolution-disclosure.stdout 2> target/independent-peer-ci/resolution-disclosure.stderr
          git diff --exit-code
      - name: Verify independent required-witness recovery and output admission
        env:
          QPERIAPT_PYTHON: ${{ steps.python.outputs.python-path }}
          TMPDIR: ${{ runner.temp }}
        run: |
          sh artifact/python-run.sh research/continuity-openssl-peer/witness_checks.py \
            --provider-root "$RUNNER_TEMP/independent-peer-provider" \
            --native target/independent-peer-ci/counterpart \
            --output target/independent-peer-ci/witness \
            > target/independent-peer-ci/witness.stdout 2> target/independent-peer-ci/witness.stderr
          git diff --exit-code
      - name: Verify independent retained-peer renewal and revocation
        env:
          QPERIAPT_PYTHON: ${{ steps.python.outputs.python-path }}
          TMPDIR: ${{ runner.temp }}
        run: |
          sh artifact/python-run.sh research/continuity-openssl-peer/peer_lifecycle_checks.py \
            --provider-root "$RUNNER_TEMP/independent-peer-provider" \
            --native target/independent-peer-ci/counterpart \
            --output target/independent-peer-ci/peer-lifecycle \
            > target/independent-peer-ci/peer-lifecycle.stdout 2> target/independent-peer-ci/peer-lifecycle.stderr
          sh artifact/python-run.sh research/continuity-openssl-peer/peer_reply_release_checks.py \
            --provider-root "$RUNNER_TEMP/independent-peer-provider" \
            --native target/independent-peer-ci/counterpart \
            --output target/independent-peer-ci/peer-reply-release \
            > target/independent-peer-ci/peer-reply-release.stdout 2> target/independent-peer-ci/peer-reply-release.stderr
          git diff --exit-code
      - name: Verify independent joint local credential renewal and historical cleanup
        env:
          QPERIAPT_PYTHON: ${{ steps.python.outputs.python-path }}
          TMPDIR: ${{ runner.temp }}
        run: |
          sh artifact/python-run.sh research/continuity-openssl-peer/local_renewal_checks.py \
            --provider-root "$RUNNER_TEMP/independent-peer-provider" \
            --native target/independent-peer-ci/counterpart \
            --output target/independent-peer-ci/local-renewal \
            > target/independent-peer-ci/local-renewal.stdout 2> target/independent-peer-ci/local-renewal.stderr
          git diff --exit-code
      - name: Verify independent local-policy renewal, expiry and capacity admission
        env:
          QPERIAPT_PYTHON: ${{ steps.python.outputs.python-path }}
          TMPDIR: ${{ runner.temp }}
        run: |
          sh artifact/python-run.sh research/continuity-openssl-peer/local_credential_checks.py \
            --provider-root "$RUNNER_TEMP/independent-peer-provider" \
            --native target/independent-peer-ci/counterpart \
            --output target/independent-peer-ci/local-credential \
            > target/independent-peer-ci/local-credential.stdout 2> target/independent-peer-ci/local-credential.stderr
          sh artifact/python-run.sh research/continuity-openssl-peer/local_credential_capacity_checks.py \
            --provider-root "$RUNNER_TEMP/independent-peer-provider" \
            --native target/independent-peer-ci/counterpart \
            --output target/independent-peer-ci/local-credential-capacity \
            > target/independent-peer-ci/local-credential-capacity.stdout 2> target/independent-peer-ci/local-credential-capacity.stderr
          git diff --exit-code
      - name: Verify independently approved exact pending-write recovery
        env:
          QPERIAPT_PYTHON: ${{ steps.python.outputs.python-path }}
          TMPDIR: ${{ runner.temp }}
        run: |
          sh artifact/python-run.sh research/continuity-openssl-peer/pending_recovery_checks.py \
            --provider-root "$RUNNER_TEMP/independent-peer-provider" \
            --native target/independent-peer-ci/counterpart \
            --output target/independent-peer-ci/pending-recovery \
            > target/independent-peer-ci/pending-recovery.stdout 2> target/independent-peer-ci/pending-recovery.stderr
          git diff --exit-code
      - name: Verify portable public inputs and original-state reconstruction
        env:
          QPERIAPT_PYTHON: ${{ steps.python.outputs.python-path }}
          TMPDIR: ${{ runner.temp }}
        run: |
          sh artifact/python-run.sh research/continuity-openssl-peer/public_input_checks.py \
            --provider-root "$RUNNER_TEMP/independent-peer-provider" \
            --native target/independent-peer-ci/counterpart \
            --importer target/independent-peer-ci/importer \
            --output target/independent-peer-ci/public-inputs \
            > target/independent-peer-ci/public-inputs.stdout 2> target/independent-peer-ci/public-inputs.stderr
          git diff --exit-code
      - name: Preserve the executable, public transcripts and failed phases
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: independent-bootstrap-${{ matrix.os }}
          path: target/independent-peer-ci/
          if-no-files-found: error
