name: Windows private policy storage

on:
  push:
    branches: [lza/windows-private-store]
    paths:
      - .github/workflows/host-store-windows.yml
      - crates/q-periapt-host-store/**
      - research/continuity-identity-candidate/**
      - bindings/c/ContinuityPackageConsumer/src/**
      - bindings/c/ContinuityPackageConsumer/Cargo.toml
      - Cargo.toml
      - Cargo.lock

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        toolchain: ["1.90.0", "1.98.1"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      RUSTFLAGS: -D warnings
      RUSTDOCFLAGS: -D warnings
      CARGO_TERM_COLOR: never
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy
      - name: Check the native adapter and its tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path target/private-store-evidence | Out-Null
          git rev-parse HEAD | Set-Content target/private-store-evidence/commit.txt
          rustc -vV | Set-Content target/private-store-evidence/rustc.txt
          cargo clippy --locked -p q-periapt-host-store --all-targets -- -D warnings 2>&1 | Tee-Object target/private-store-evidence/clippy.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise private admission publication and cross-process exclusion
        shell: pwsh
        run: |
          cargo test --locked -p q-periapt-host-store --all-targets -- --nocapture 2>&1 | Tee-Object target/private-store-evidence/tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --release -p q-periapt-host-store --all-targets -- --nocapture 2>&1 | Tee-Object target/private-store-evidence/release-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p q-periapt-host-store --doc 2>&1 | Tee-Object target/private-store-evidence/doc-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise Windows client key reopening
        shell: pwsh
        run: |
          $manifest = 'research/continuity-identity-candidate/Cargo.toml'
          cargo clippy --locked --manifest-path $manifest --lib --tests --no-default-features -- -D warnings 2>&1 | Tee-Object target/private-store-evidence/client-clippy.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path $manifest --lib --no-default-features windows_key_reopen -- --nocapture 2>&1 | Tee-Object target/private-store-evidence/client-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --release --manifest-path $manifest --lib --no-default-features windows_key_reopen -- --nocapture 2>&1 | Tee-Object target/private-store-evidence/client-release-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise acknowledged signer retirement on native Windows
        shell: pwsh
        run: |
          $manifest = 'research/continuity-identity-candidate/Cargo.toml'
          cargo test --locked --manifest-path $manifest --lib --no-default-features crypto::persistence::retirement::tests -- --nocapture 2>&1 | Tee-Object target/private-store-evidence/retirement-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --release --manifest-path $manifest --lib --no-default-features crypto::persistence::retirement::tests -- --nocapture 2>&1 | Tee-Object target/private-store-evidence/retirement-release-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build the Windows Continuity C facade from source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = (Get-Location).Path
          $consumer = Join-Path $env:RUNNER_TEMP 'continuity-consumer-source'
          New-Item -ItemType Directory -Path $consumer | Out-Null
          Copy-Item bindings/c/ContinuityPackageConsumer/src $consumer -Recurse
          Copy-Item bindings/c/ContinuityPackageConsumer/Cargo.toml $consumer
          Copy-Item research/continuity-identity-candidate/Cargo.lock (Join-Path $consumer 'Cargo.lock')
          $patches = "`n[patch.crates-io]`n"
          $names = @('q-periapt-backends', 'q-periapt-core', 'q-periapt-host-store', 'q-periapt-kem', 'q-periapt-mlkem-native-sys', 'q-periapt-policy', 'q-periapt-rustls', 'q-periapt-sdk', 'q-periapt-sig', 'q-periapt-continuity-identity-candidate')
          foreach ($name in $names) {
            $relative = if ($name -eq 'q-periapt-continuity-identity-candidate') { 'research/continuity-identity-candidate' } else { "crates/$name" }
            $path = (Join-Path $root $relative).Replace('\', '/') | ConvertTo-Json -Compress
            $patches += "$name = { path = $path }`n"
          }
          Add-Content -Path (Join-Path $consumer 'Cargo.toml') -Value $patches -Encoding utf8
          $manifest = Join-Path $consumer 'Cargo.toml'
          $env:CARGO_TARGET_DIR = Join-Path $root 'research/continuity-identity-candidate/target'
          cargo metadata --manifest-path $manifest --format-version 1 1> target/private-store-evidence/consumer-metadata.json 2> target/private-store-evidence/consumer-resolution.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item (Join-Path $consumer 'Cargo.lock') target/private-store-evidence/consumer-Cargo.lock
          Copy-Item $manifest target/private-store-evidence/consumer-Cargo.toml
          cargo clippy --locked --manifest-path $manifest --lib -- -D warnings 2>&1 | Tee-Object target/private-store-evidence/consumer-clippy.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked --release --manifest-path $manifest --lib 2>&1 | Tee-Object target/private-store-evidence/consumer-release.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $library = Join-Path $env:CARGO_TARGET_DIR 'release/q_periapt_continuity_c_consumer.dll'
          $receipt = @{ scope = 'Windows source facade compilation only; no installed-package or runtime qualification'; source = (git rev-parse HEAD); bytes = (Get-Item $library).Length; sha256 = (Get-FileHash $library -Algorithm SHA256).Hash.ToLowerInvariant() }
          $receipt | ConvertTo-Json | Set-Content target/private-store-evidence/consumer-library.json -Encoding utf8
      - name: Exercise Windows first-use publication and fresh admission
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $consumer = Join-Path $env:RUNNER_TEMP 'continuity-consumer-source'
          $manifest = Join-Path $consumer 'Cargo.toml'
          $env:CARGO_TARGET_DIR = Join-Path (Get-Location).Path 'research/continuity-identity-candidate/target'
          $env:QPC_FIRST_USE_ROOT = Join-Path $env:RUNNER_TEMP 'continuity-first-use-private'
          New-Item -ItemType Directory -Path $env:QPC_FIRST_USE_ROOT | Out-Null
          $privateRoot = @'
          $ErrorActionPreference = 'Stop'
          $sid = [System.Security.Principal.WindowsIdentity]::GetCurrent().User
          $acl = New-Object System.Security.AccessControl.DirectorySecurity
          $acl.SetOwner($sid)
          $acl.SetAccessRuleProtection($true, $false)
          $inherit = [System.Security.AccessControl.InheritanceFlags]'ContainerInherit, ObjectInherit'
          $allow = [System.Security.AccessControl.AccessControlType]::Allow
          $none = [System.Security.AccessControl.PropagationFlags]::None
          $acl.AddAccessRule((New-Object System.Security.AccessControl.FileSystemAccessRule($sid, 'FullControl', $inherit, $none, $allow)))
          [System.IO.Directory]::SetAccessControl($env:QPC_FIRST_USE_ROOT, $acl)
          '@
          $powershell = Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'
          & $powershell -NoLogo -NoProfile -NonInteractive -Command $privateRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked --manifest-path $manifest --lib --tests -- -D warnings 2>&1 | Tee-Object target/private-store-evidence/first-use-clippy.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path $manifest --lib first_install::windows_tests -- --nocapture 2>&1 | Tee-Object target/private-store-evidence/first-use-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --release --manifest-path $manifest --lib first_install::windows_tests -- --nocapture 2>&1 | Tee-Object target/private-store-evidence/first-use-release-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve native results including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: private-store-${{ matrix.os }}-${{ matrix.toolchain }}
          path: target/private-store-evidence/
          if-no-files-found: error
