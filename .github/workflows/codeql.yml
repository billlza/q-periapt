name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build_mode: none
            runner: ubuntu-latest
          - language: c-cpp
            build_mode: none
            runner: ubuntu-latest
          - language: java-kotlin
            build_mode: manual
            runner: ubuntu-latest
          - language: python
            build_mode: none
            runner: ubuntu-latest
          - language: rust
            build_mode: none
            runner: ubuntu-latest
          - language: swift
            build_mode: manual
            runner: macos-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          persist-credentials: false

      - name: Set up Rust CodeQL compatibility toolchain
        if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.94.0
          components: rust-src

      - name: Set up canonical Rust toolchain
        if: matrix.language == 'java-kotlin' || matrix.language == 'rust' || matrix.language == 'swift'
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.96.1

      - name: Compile all Rust targets with compatibility and canonical toolchains
        if: matrix.language == 'rust'
        run: |
          test ! -e target && test ! -L target
          RUSTFLAGS='-D warnings' \
            CARGO_TARGET_DIR="${RUNNER_TEMP}/qperiapt-rust-check-1.94.0" \
            cargo +1.94.0 check --workspace --all-targets --locked
          RUSTFLAGS='-D warnings' \
            CARGO_TARGET_DIR="${RUNNER_TEMP}/qperiapt-rust-check-1.96.1" \
            cargo +1.96.1 check --workspace --all-targets --locked
          test ! -e target && test ! -L target

      - name: Verify Rust CodeQL checkout before initialization
        if: matrix.language == 'rust'
        env:
          CODEQL_EXPECTED_COMMIT: ${{ github.sha }}
        run: sh artifact/python-run.sh artifact/codeql_rust_checkout.py

      - name: Bind Rust CodeQL to the compatible analysis sysroot
        if: matrix.language == 'rust'
        run: |
          test "$(rustc +1.94.0 --version)" = \
            "rustc 1.94.0 (4a4ef493e 2026-03-02)"
          analysis_sysroot=$(rustc +1.94.0 --print sysroot)
          analysis_sysroot_src="${analysis_sysroot}/lib/rustlib/src/rust/library"
          test -d "$analysis_sysroot_src"
          [[ "$analysis_sysroot" = /* ]]
          [[ "$analysis_sysroot" != *$'\n'* ]]
          {
            printf 'RUSTUP_TOOLCHAIN=%s\n' '1.94.0'
            printf 'CODEQL_EXTRACTOR_RUST_OPTION_SYSROOT=%s\n' "$analysis_sysroot"
            printf 'CODEQL_EXTRACTOR_RUST_OPTION_SYSROOT_SRC=%s\n' "$analysis_sysroot_src"
          } >> "$GITHUB_ENV"

      - name: Set up Java 22
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: "22"

      - name: Set up Gradle 9.2.1
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          gradle-version: "9.2.1"

      - name: Initialize CodeQL
        id: codeql_init
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          build-mode: ${{ matrix.build_mode }}
          config: |
            threat-models: [local]
          db-location: ${{ runner.temp }}/qperiapt-codeql-database
          languages: ${{ matrix.language }}
          queries: security-extended
          tools: linked

      - name: Bind Rust quality gate to the linked CodeQL bundle
        if: matrix.language == 'rust'
        env:
          CODEQL_BINARY: ${{ steps.codeql_init.outputs.codeql-path }}
        run: |
          fixed_codeql=/opt/hostedtoolcache/CodeQL/2.26.2/x64/codeql/codeql
          test "$CODEQL_BINARY" = "$fixed_codeql"
          stat --format='CODEQL_TOOLCACHE_STAT type=%F mode=%a uid=%u gid=%g nlink=%h' \
            -- "$fixed_codeql"

      - name: Verify linked CodeQL bundle
        env:
          CODEQL_BINARY: ${{ steps.codeql_init.outputs.codeql-path }}
        run: test "$("$CODEQL_BINARY" version --format=terse)" = "2.26.2"

      - name: Build Kotlin binding
        if: matrix.language == 'java-kotlin'
        run: |
          cargo build --locked -p q-periapt-ffi --release
          gradle test --project-dir bindings/kotlin --no-daemon --warning-mode fail

      - name: Build Swift binding
        if: matrix.language == 'swift'
        # The CodeQL Swift extractor may drive the SwiftPM build for a
        # different architecture than the runner host (observed: an
        # x86_64-apple-macosx SwiftPM triple on an arm64 runner). Provide a
        # universal *static* library only, so whichever slice the tracer
        # selects links hermetically and the XCTest binary carries no runtime
        # dylib dependency.
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --locked -p q-periapt-ffi --release --target aarch64-apple-darwin
          cargo build --locked -p q-periapt-ffi --release --target x86_64-apple-darwin
          mkdir -p target/release
          rm -f target/release/libq_periapt_ffi_abi2.a target/release/libq_periapt_ffi_abi2.dylib
          lipo -create \
            target/aarch64-apple-darwin/release/libq_periapt_ffi_abi2.a \
            target/x86_64-apple-darwin/release/libq_periapt_ffi_abi2.a \
            -output target/release/libq_periapt_ffi_abi2.a
          lipo -info target/release/libq_periapt_ffi_abi2.a
          swift test --package-path bindings/swift -Xlinker -L${{ github.workspace }}/target/release

      - name: Analyze
        id: codeql_analyze
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: /language:${{ matrix.language }}
          upload: ${{ matrix.language == 'rust' && 'never' || 'always' }}
          upload-database: ${{ matrix.language == 'rust' && 'false' || 'true' }}

      - name: Reject repository-local Rust build output
        if: matrix.language == 'rust'
        run: test ! -e target && test ! -L target

      - name: Verify Rust CodeQL checkout after analysis
        if: matrix.language == 'rust'
        env:
          CODEQL_EXPECTED_COMMIT: ${{ github.sha }}
        run: sh artifact/python-run.sh artifact/codeql_rust_checkout.py

      - name: Verify Rust CodeQL database quality
        if: matrix.language == 'rust'
        env:
          CODEQL_EXPECTED_COMMIT: ${{ github.sha }}
        run: sh artifact/python-run.sh artifact/codeql_rust_quality.py

      - name: Upload quality-gated Rust CodeQL results
        if: matrix.language == 'rust'
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: /language:${{ matrix.language }}
          sarif_file: ${{ steps.codeql_analyze.outputs.sarif-output }}
          wait-for-processing: true
