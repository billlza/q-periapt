# Install as /etc/tmpfiles.d/q-periapt-agent.conf
#
# /run is a tmpfs, so this directory does not survive a reboot. Without this
# file systemd creates it on demand as the parent of ListenStream=, using
# DirectoryMode= (0755) and owning it root:root -- neither the daemon account
# nor the transport group, and world-traversable.
#
# That matters more than a socket mode would. The daemon cannot verify the
# socket's own owner, group or mode: an AF_UNIX descriptor names a socket
# object rather than the filesystem node addressing it. This directory's mode
# is therefore the admission boundary it actually relies on, and 0710 is what
# makes membership of the transport group mean something -- the group may
# traverse to the socket, and nobody else may.
#
# Replace both names with the accounts created in the provisioning order.
#
#Type Path                 Mode Owner           Group              Age Argument
d     /run/qperiapt-agent  0710 qperiapt-agent  qperiapt-clients   -   -
