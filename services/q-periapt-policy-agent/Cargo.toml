[package]
name = "q-periapt-policy-agent"
description = "Process-isolated migration policy, witness, and session execution service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false
readme = "README.md"

[lints]
workspace = true

[dependencies]
getrandom = "0.4"
q-periapt-backends = { version = "=0.1.5", path = "../../crates/q-periapt-backends" }
q-periapt-core = { version = "=0.1.5", path = "../../crates/q-periapt-core" }
q-periapt-ffi = { version = "=0.1.5", path = "../../crates/q-periapt-ffi" }
q-periapt-migration = { version = "=0.1.5", path = "../../models/q-periapt-migration" }
q-periapt-policy = { version = "=0.1.5", path = "../../crates/q-periapt-policy" }
q-periapt-sig = { version = "=0.1.5", path = "../../crates/q-periapt-sig" }
# redb 2.6.3 is a pure-Rust ACID release whose declared MSRV matches this
# workspace's Rust 1.85 floor; the current 4.2 release requires Rust 1.89. The
# exact pin also fixes the durable file-format implementation reviewed for this
# non-publishable service.
redb = "=2.6.3"

[target.'cfg(unix)'.dependencies]
# Descriptor-relative opens keep the durable-state boundary beneath an already
# opened directory capability and avoid path re-resolution races. This exact
# version is already present through the workspace test toolchain.
# `net` is required to interrogate the inherited socket-activation descriptor
# (socket type, listening state on Linux, and the bound name) without unsafe.
# `event` supplies the bounded `poll` the serving loop waits in, so an idle
# daemon still reaches its session-TTL sweep. It declares no dependencies.
rustix = { version = "=1.1.4", features = ["event", "fs", "net", "process"] }

[dev-dependencies]
tempfile = "=3.27.0"

[[bin]]
name = "q-periapt-policy-agent"
path = "src/main.rs"
